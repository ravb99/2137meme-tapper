<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2137MEME TAPPER</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    body { margin:0; padding:0; background:#0a0a0a; color:#ff0; font-family:'Oswald', sans-serif; overflow:hidden; height:100vh; touch-action: manipulation; text-align:center; }
    #game { max-width:420px; margin:0 auto; padding:4px 15px 8px; height:100vh; display:flex; flex-direction:column; }
    h1 { font-size:42px; font-weight:900; margin:2px 0; letter-spacing:4px; }
    .subtitle { font-size:29px; font-weight:900; color:#fff; margin:0; letter-spacing:7px; }
    #timer { font-size:62px; font-weight:900; color:#f00; margin:6px 0 8px; }
    #nosaczContainer { position:relative; width:298px; height:298px; margin:4px auto 6px; }
    #nosacz { width:100%; height:100%; border-radius:50%; border:8px solid #ff0; box-shadow:0 0 30px #ff0; transition: filter 0.09s ease-out; }
    .kurwa { position:absolute; color:#ff0; font-size:46px; font-weight:900; pointer-events:none; animation: kurwaAnim 1.1s forwards; }
    @keyframes kurwaAnim { 0%{transform:translate(-50%,-50%)scale(0.6);opacity:1} 100%{transform:translate(-50%,-190px)scale(1.3);opacity:0} }
    #tapCount { font-size:27px; margin:6px 0 8px; }
    button { background:#ff0; color:#111; border:4px solid #000; padding:12px 20px; font-size:17px; font-weight:900; margin:5px auto; border-radius:8px; width:88%; }
    #result { margin:8px 0 6px; font-size:24px; font-weight:900; display:none; }
    .restart-btn {
      position:absolute; top:50%; left:50%; transform:translate(-50%, -50%);
      background:#0f0; color:#000; font-size:20px; font-weight:900;
      padding:15px 30px; border:6px solid #000; border-radius:12px;
      box-shadow:0 0 20px #0f0; cursor:pointer; z-index:10;
      white-space:nowrap;
    }
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.94); z-index:100; }
    .modal-content { max-width:380px; margin:60px auto; background:#2a2a2a; border:6px solid #777; border-radius:3px; overflow:hidden; display:flex; flex-direction:column; max-height:85vh; }
    .title-bar { background:#333; color:#ddd; padding:9px 12px; font-weight:900; text-align:left; border-bottom:4px solid #555; font-size:19px; }
    .window-body { padding:18px; flex:1; overflow:hidden; display:flex; flex-direction:column; }
    #lbList { flex:1; overflow-y:auto; padding-right:8px; }
    .lb-entry { display:flex; justify-content:space-between; padding:10px 12px; margin:6px 0; background:#1f1f1f; border:2px solid #666; color:#ff0; font-size:17px; }
  </style>
</head>
<body>
  <div id="game">
    <h1>2137MEME</h1>
    <div class="subtitle">WORTHLESS</div>
    <div id="timer">21.37</div>
    <div id="nosaczContainer">
      <img id="nosacz" src="https://raw.githubusercontent.com/ravb99/2137meme-tapper/main/images/IMG_6353.jpeg" alt="Nosacz"> 
    </div>
    <div id="tapCount">Taps: <span id="count">0</span></div>
    
    <button onclick="changeNickname()">Zmień nick</button>
    <button onclick="showLeaderboard()">TOP 21 LEADERBOARD</button>

    <div id="result">
      <span id="finalScore"></span>
    </div>
  </div>

  <!-- Leaderboard -->
  <div id="leaderboardModal" class="modal">
    <div class="modal-content">
      <div class="title-bar">🏆 TOP 21 TAPPERS - 2137MEME</div>
      <div class="window-body">
        <div id="lbList"></div>
        <button onclick="hideLeaderboard()" style="margin-top:10px;">Dawaj Janusza!</button>
      </div>
    </div>
  </div>

  <!-- Zmiana nicku -->
  <div id="nicknameModal" class="modal">
    <div class="modal-content">
      <div class="title-bar">ZMIANA NICKU - 2137MEME</div>
      <div class="window-body">
        <p style="margin:10px 0 15px; color:#ccc;">Wpisz nowy nick, stary:</p>
        <input type="text" id="nickInput" maxlength="20" placeholder="Janusz420">
        <div class="nick-buttons" style="display:flex;justify-content:center;gap:12px;margin-top:15px;">
          <button onclick="saveNewNickname()">ZATWIERDZAM</button>
          <button onclick="hideNicknameModal()" style="background:#555;color:#ff0;">ANULUJ</button>
        </div>
      </div>
    </div>
  </div>

  <audio id="kurlaSound" src="https://raw.githubusercontent.com/ravb99/2137meme-tapper/main/sounds/Kurła.m4a" preload="auto"></audio>

  <script>
    const SUPABASE_URL = 'https://gmyhsgxnpbvwgexrvpik.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_dPOUiTHcX9Xk7tQQr3oOWw_0aEfDVUm';

    let timeLeft = 21.37;
    let taps = 0;
    let isRunning = false;
    let lastFrame = 0;
    const sound = document.getElementById('kurlaSound');
    const nosaczImg = document.getElementById('nosacz');
    const resultDiv = document.getElementById('result');

    function getPlayerName() {
      const saved = localStorage.getItem('2137playerName');
      if (saved) return saved;
      const user = Telegram.WebApp.initDataUnsafe?.user;
      if (user?.username) return "@" + user.username;
      if (user?.first_name) return user.first_name + (user.last_name ? " " + user.last_name : "");
      return "Janusz" + Math.floor(Math.random()*999);
    }

    function playKurwa() {
      sound.currentTime = 0;
      sound.play().catch(() => {});
    }

    function createRandomKurwa() {
      const k = document.createElement('div');
      k.className = 'kurwa';
      k.textContent = 'Kurła!';
      const randomX = Math.random() * 280 + 60;
      const randomY = Math.random() * 160 + 70;
      k.style.left = randomX + 'px';
      k.style.top = randomY + 'px';
      document.getElementById('nosaczContainer').appendChild(k);
      setTimeout(() => k.remove(), 1300);
    }

    function tap(e) {
      if (!isRunning) startTimer();
      const touchCount = (e.touches && e.touches.length > 1) ? e.touches.length : 1;
      taps += touchCount;
      document.getElementById('count').textContent = taps;

      nosaczImg.style.filter = `hue-rotate(20deg) saturate(3.4) brightness(1.38)`;
      setTimeout(() => nosaczImg.style.filter = '', 95);

      playKurwa();
      for (let i = 0; i < touchCount; i++) createRandomKurwa();
    }

    function startTimer() {
      if (isRunning) return;
      isRunning = true;
      timeLeft = 21.37;
      taps = 0;
      document.getElementById('count').textContent = taps;
      lastFrame = performance.now();

      function loop(now) {
        if (!isRunning) return;
        const delta = (now - lastFrame) / 1000;
        lastFrame = now;
        timeLeft -= delta;
        if (timeLeft <= 0) {
          document.getElementById('timer').textContent = "0.00";
          endRound();
        } else {
          document.getElementById('timer').textContent = timeLeft.toFixed(2);
          requestAnimationFrame(loop);
        }
      }
      requestAnimationFrame(loop);
    }

    function endRound() {
      isRunning = false;
      document.getElementById('finalScore').innerHTML = `Koniec rundy! Twój wynik: <span style="color:#f00;">${taps}</span>`;
      saveScore(taps);
      resultDiv.style.display = 'block';
    }

    async function saveScore(score) {
      const name = getPlayerName();
      const response = await fetch(`${SUPABASE_URL}/rest/v1/scores`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${SUPABASE_KEY}`
        },
        body: JSON.stringify([{ name, score }])
      });
      console.log(response.ok ? "✅ Zapisano globalnie" : "❌ Błąd zapisu");
    }

    async function updateLeaderboard() {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/scores?select=name,score&order=score.desc&limit=21`, {
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
      });
      const data = await response.json();
      const list = document.getElementById('lbList');
      list.innerHTML = '';
      data.forEach((entry, i) => {
        const div = document.createElement('div');
        div.className = 'lb-entry';
        div.innerHTML = `<span>${i+1}. ${entry.name}</span><span>${entry.score}</span>`;
        list.appendChild(div);
      });
    }

    function showLeaderboard() {
      updateLeaderboard();
      document.getElementById('leaderboardModal').style.display = 'block';
    }

    function hideLeaderboard() {
      document.getElementById('leaderboardModal').style.display = 'none';
    }

    function changeNickname() {
      document.getElementById('nickInput').value = getPlayerName();
      document.getElementById('nicknameModal').style.display = 'block';
    }

    function saveNewNickname() {
      const newName = document.getElementById('nickInput').value.trim();
      if (newName) {
        localStorage.setItem('2137playerName', newName);
        alert("Nick zmieniony na: " + newName);
      }
      hideNicknameModal();
    }

    function hideNicknameModal() {
      document.getElementById('nicknameModal').style.display = 'none';
    }

    function restartGame() {
      resultDiv.style.display = 'none';
      timeLeft = 21.37;
      taps = 0;
      isRunning = false;
      document.getElementById('count').textContent = 0;
      document.getElementById('timer').textContent = "21.37";
    }

    const container = document.getElementById('nosaczContainer');
    container.addEventListener('touchstart', tap, { passive: true });
    container.addEventListener('mousedown', tap);

    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  </script>
</body>
</html>

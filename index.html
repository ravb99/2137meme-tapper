<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Test Supabase Save</title>
</head>
<body>
  <h1>Test zapisu do Supabase</h1>
  <button onclick="testSave()">TEST ZAPISU</button>
  <div id="log" style="margin-top:20px; white-space:pre-wrap; font-family:monospace;"></div>

  <script>
    const SUPABASE_URL = 'https://gmyhsgxnpbvwgexrvpik.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_dPOUiTHcX9Xk7tQQr3oOWw_0aEfDVUm';

    async function testSave() {
      const log = document.getElementById('log');
      log.innerHTML = 'Wysyłam dane...\n';

      const payload = [{
        name: "TestUser123",
        pin: "9999",
        round_score: 420,
        total_score: 1337,
        kurla_coins: 999,
        lifetime_taps: 1337,
        spendable_taps: 500,
        multiplier: 1,
        current_streak: 3,
        last_login: new Date().toISOString(),
        referred_by: null,
        referral_claimed: false,
        first_login: new Date().toISOString()
      }];

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/scores`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Prefer': 'resolution=merge-duplicates'
          },
          body: JSON.stringify(payload)
        });

        const responseText = await response.text();

        log.innerHTML += `Status: ${response.status}\n`;
        log.innerHTML += `Odpowiedź: ${responseText}\n`;

        if (response.ok) {
          log.innerHTML += `\n✅ ZAPISANO POMYŚLNIE!`;
        } else {
          log.innerHTML += `\n❌ BŁĄD: ${response.status}`;
        }
      } catch (e) {
        log.innerHTML += `\nBŁĄD WYJĄTKU: ${e.message}`;
      }
    }
  </script>
</body>
</html>

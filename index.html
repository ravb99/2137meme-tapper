<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2137MEME TAPPER</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { margin:0; padding:0; background:#0a0a0a; color:#ff0; font-family:'Press Start 2P', system-ui; overflow:hidden; text-align:center; }
    #game { max-width:420px; margin:0 auto; padding:20px; }
    h1 { font-size:28px; margin:10px 0 5px; text-shadow:0 0 15px #ff0; }
    #timer { font-size:52px; font-weight:bold; color:#f00; text-shadow:0 0 20px #f00; margin:15px 0; }
    
    #nosaczContainer { position:relative; width:300px; height:300px; margin:20px auto; cursor:pointer; }
    #nosacz { width:100%; height:100%; border-radius:50%; border:8px solid #ff0; box-shadow:0 0 30px #ff0; transition:transform 0.1s; }
    #nose { position:absolute; top:45%; left:50%; transform:translate(-50%, -50%); width:80px; height:80px; background:#f44; border-radius:50%; box-shadow:0 0 20px #f00; transition:all 0.15s; }

    .kurwa { 
      position:absolute; 
      color:#ff0; 
      font-size:42px; 
      font-weight:900; 
      text-shadow:0 0 15px #f00, 0 0 25px #f00; 
      pointer-events:none; 
      animation: kurwaAnim 1.1s forwards; 
      -webkit-text-stroke: 2px #000;
    }
    @keyframes kurwaAnim {
      0% { transform:translate(-50%, -50%) scale(0.6); opacity:1; }
      100% { transform:translate(-50%, -180px) scale(1.3); opacity:0; }
    }

    #tapCount { font-size:32px; margin:10px 0; }
    #result { display:none; margin-top:30px; }
    button { background:#ff0; color:#111; border:none; padding:16px 32px; font-size:18px; margin:10px; border-radius:8px; cursor:pointer; }
  </style>
</head>
<body>
  <div id="game">
    <h1>$2137MEME TAPPER</h1>
    <div id="timer">21.37</div>

    <div id="nosaczContainer" onclick="tap(event)">
      <img id="nosacz" src="https://i.imgur.com/0zKzKzK.jpeg" alt="Nosacz"> 
      <div id="nose"></div>
    </div>

    <div id="tapCount">Taps: <span id="count">0</span></div>

    <div id="result">
      <h2>Koniec rundy!</h2>
      <p id="finalScore" style="font-size:28px;"></p>
      <div id="randomMeme" style="margin:20px 0; font-size:20px; min-height:90px;"></div>
      <button onclick="restart()">Jeszcze raz → 21.37s</button>
    </div>
  </div>

  <script>
    let timeLeft = 21.37;
    let taps = 0;
    let timer;
    let isRunning = false;

    const memes = [
      "Nosacz po 21.37s: 'Ja tylko chwilę potapam...'",
      "Janusz: 'Kurła, ale wynik!'",
      "Pudzian: 'Słabo bracie, dawaj jeszcze raz'",
      "Mirek: 'Kupujesz? Super. Nie tapniesz? Śmiejemy się razem'",
      "Demotywator: 'Chciałem być tap kingiem... wyszło 2137MEME'"
    ];

    function createKurwa(x, y) {
      const kurwa = document.createElement('div');
      kurwa.className = 'kurwa';
      kurwa.textContent = 'Kurła!';
      kurwa.style.left = x + 'px';
      kurwa.style.top = y + 'px';
      document.getElementById('nosaczContainer').appendChild(kurwa);
      setTimeout(() => kurwa.remove(), 1300);
    }

    function tap(e) {
      if (!isRunning) startTimer();

      taps++;
      document.getElementById('count').textContent = taps;

      const nose = document.getElementById('nose');
      nose.style.background = '#f00';
      nose.style.transform = 'translate(-50%, -50%) scale(1.4)';
      
      setTimeout(() => {
        nose.style.background = '#f44';
        nose.style.transform = 'translate(-50%, -50%) scale(1)';
      }, 140);

      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;
      createKurwa(clickX, clickY - 40);
    }

    function startTimer() {
      if (isRunning) return;
      isRunning = true;
      timeLeft = 21.37;
      taps = 0;
      document.getElementById('count').textContent = taps;
      document.getElementById('result').style.display = 'none';

      timer = setInterval(() => {
        timeLeft = Math.max(0, timeLeft - 0.01);
        document.getElementById('timer').textContent = timeLeft.toFixed(2);
        if (timeLeft <= 0) endRound();
      }, 10);
    }

    function endRound() {
      clearInterval(timer);
      isRunning = false;
      document.getElementById('finalScore').innerHTML = `Twój wynik: <b>${taps}</b>`;
      document.getElementById('randomMeme').textContent = memes[Math.floor(Math.random()*memes.length)];
      document.getElementById('result').style.display = 'block';
    }

    function restart() {
      startTimer();
    }

    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  </script>
</body>
</html>

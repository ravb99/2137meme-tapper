<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2137MEME TAPPER</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { 
      margin:0; padding:0; 
      background:#0a0a0a; 
      color:#ff0; 
      font-family:'Oswald', system-ui; 
      overflow:hidden; 
      text-align:center; 
      touch-action: none; 
    }
    #game { max-width:420px; margin:0 auto; padding:20px; }
    
    h1 { 
      font-size:38px; 
      margin:15px 0 6px; 
      text-shadow:0 0 25px #ff0; 
      letter-spacing:3px; 
      font-weight:700;
    }
    .subtitle { 
      font-size:22px; 
      color:#aaa; 
      margin-bottom:25px; 
      font-weight:400; 
      letter-spacing:2px;
    }

    #timer { 
      font-size:52px; 
      font-weight:700; 
      color:#f00; 
      text-shadow:0 0 20px #f00; 
      margin:10px 0 20px; 
    }
    
    #nosaczContainer { 
      position:relative; 
      width:300px; 
      height:300px; 
      margin:15px auto; 
      cursor:pointer; 
      user-select:none; 
      -webkit-tap-highlight-color: transparent;
    }
    #nosacz { width:100%; height:100%; border-radius:50%; border:8px solid #ff0; box-shadow:0 0 30px #ff0; }
    
    #noseOverlay { 
      position:absolute; top:47%; left:50%; transform:translate(-50%, -50%); 
      width:78px; height:78px; background:#f44; border-radius:50%; 
      box-shadow:0 0 25px #f00; transition:all 0.08s; cursor:pointer;
    }

    .kurwa { 
      position:absolute; color:#ff0; font-size:42px; font-weight:900; 
      text-shadow:0 0 15px #f00; pointer-events:none; 
      animation: kurwaAnim 1.1s forwards; 
    }
    @keyframes kurwaAnim {
      0% { transform:translate(-50%, -50%) scale(0.6); opacity:1; }
      100% { transform:translate(-50%, -180px) scale(1.3); opacity:0; }
    }

    #tapCount { font-size:28px; margin:15px 0; }

    button { 
      background: linear-gradient(145deg, #ff0, #ffcc00);
      color:#111; 
      border:none; 
      padding:18px 32px; 
      font-size:19px; 
      font-weight:700;
      margin:20px auto; 
      border-radius:12px; 
      cursor:pointer; 
      width:85%; 
      display:block;
      box-shadow: 0 8px 20px rgba(255, 204, 0, 0.4);
      transition: all 0.2s;
    }
    button:active {
      transform: scale(0.95);
      box-shadow: 0 4px 10px rgba(255, 204, 0, 0.3);
    }

    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:100; overflow-y:auto; }
    .modal-content { max-width:420px; margin:40px auto; padding:20px; text-align:left; }
    .lb-entry { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #333; font-size:16px; }
  </style>
</head>
<body>
  <div id="game">
    <h1>2137MEME TAPPER</h1>
    <div class="subtitle">WORTHLESS</div>
    
    <div id="timer">21.37</div>

    <div id="nosaczContainer" onclick="tap(event)">
      <img id="nosacz" src="https://raw.githubusercontent.com/ravb99/2137meme-tapper/main/images/IMG_6353.jpeg" alt="Nosacz"> 
      <div id="noseOverlay"></div>
    </div>

    <div id="tapCount">Taps: <span id="count">0</span></div>

    <button onclick="showLeaderboard()">TOP 21 LEADERBOARD</button>

    <div id="result" style="display:none; margin-top:20px;">
      <h2>Koniec rundy!</h2>
      <p id="finalScore" style="font-size:26px;"></p>
      <button onclick="restart()">Jeszcze raz → 21.37s</button>
    </div>
  </div>

  <div id="leaderboardModal" class="modal">
    <div class="modal-content">
      <h2>🏆 TOP 21 TAPPERS</h2>
      <div id="lbList"></div>
      <button onclick="hideLeaderboard()" style="width:auto; margin-top:20px;">Zamknij</button>
    </div>
  </div>

  <audio id="kurlaSound" src="https://raw.githubusercontent.com/ravb99/2137meme-tapper/main/sounds/Kurła.m4a"></audio>

  <script>
    // (Cała logika timera, tap, dźwięk, leaderboard bez zmian - taka sama jak w poprzedniej wersji)
    let timeLeft = 21.37;
    let taps = 0;
    let timer;
    let isRunning = false;
    let leaderboard = JSON.parse(localStorage.getItem('2137leaderboard')) || [];
    const sound = document.getElementById('kurlaSound');

    function playKurwa() {
      sound.currentTime = 0;
      sound.play().catch(() => {});
    }

    function createKurwa(x, y) {
      const k = document.createElement('div');
      k.className = 'kurwa';
      k.textContent = 'Kurła!';
      k.style.left = x + 'px';
      k.style.top = y + 'px';
      document.getElementById('nosaczContainer').appendChild(k);
      setTimeout(() => k.remove(), 1200);
    }

    function tap(e) {
      if (!isRunning) startTimer();
      taps++;
      document.getElementById('count').textContent = taps;

      const nose = document.getElementById('noseOverlay');
      nose.style.transform = 'translate(-50%, -50%) scale(1.45)';
      nose.style.background = '#f00';
      setTimeout(() => {
        nose.style.transform = 'translate(-50%, -50%) scale(1)';
        nose.style.background = '#f44';
      }, 80);

      playKurwa();
      const rect = e.currentTarget.getBoundingClientRect();
      createKurwa(e.clientX - rect.left, e.clientY - rect.top - 50);
    }

    function startTimer() { /* ... taka sama jak wcześniej ... */ }
    function endRound() { /* ... */ }
    function saveScore(score) { /* ... */ }
    function updateLeaderboard() { /* ... */ }
    function showLeaderboard() { updateLeaderboard(); document.getElementById('leaderboardModal').style.display = 'block'; }
    function hideLeaderboard() { document.getElementById('leaderboardModal').style.display = 'none'; }
    function restart() { /* ... */ }

    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  </script>
</body>
</html>

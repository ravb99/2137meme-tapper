<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2137MEME TAPPER</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { margin:0; padding:0; background:#0a0a0a; color:#ff0; font-family:'Oswald', sans-serif; overflow:hidden; height:100vh; touch-action: manipulation; }
    #game { max-width:420px; margin:0 auto; padding:4px 15px 8px; height:100vh; display:flex; flex-direction:column; }
    .header { margin:2px 0 3px; }
    h1 { font-size:42px; font-weight:900; margin:0; letter-spacing:4px; line-height:0.95; }
    .subtitle { font-size:29px; font-weight:900; color:#fff; margin:0; letter-spacing:7px; line-height:0.9; }
    #timer { font-size:62px; font-weight:900; color:#f00; margin:6px 0 8px; }
    #nosaczContainer { position:relative; width:298px; height:298px; margin:4px auto 6px; }
    #nosacz { width:100%; height:100%; border-radius:50%; border:8px solid #ff0; box-shadow:0 0 30px #ff0; transition: filter 0.1s; }
    .kurwa { position:absolute; color:#ff0; font-size:46px; font-weight:900; pointer-events:none; animation: kurwaAnim 1.1s forwards; }
    @keyframes kurwaAnim { 0%{transform:translate(-50%,-50%) scale(0.6); opacity:1;} 100%{transform:translate(-50%,-190px) scale(1.3); opacity:0;} }
    #tapCount { font-size:27px; margin:6px 0 8px; }
    button { background:#ff0; color:#111; border:4px solid #000; padding:12px 20px; font-size:17px; font-weight:900; margin:5px auto; border-radius:8px; width:88%; }
    #result { margin:8px 0 6px; font-size:24px; font-weight:900; }
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:100; }
    .modal-content { max-width:380px; margin:60px auto; background:#2a2a2a; border:6px solid #777; border-radius:3px; overflow:hidden; display:flex; flex-direction:column; max-height:85vh; }
    .title-bar { background:#333; color:#ddd; padding:9px 12px; font-weight:900; text-align:left; border-bottom:4px solid #555; }
    .window-body { padding:18px; flex:1; overflow:hidden; display:flex; flex-direction:column; }
    #lbList { flex:1; overflow-y:auto; }
    .lb-entry { display:flex; justify-content:space-between; padding:10px 12px; margin:6px 0; background:#1f1f1f; border:2px solid #666; color:#ff0; }
    input { width:100%; padding:14px; background:#1a1a1a; color:#ff0; border:3px solid #777; font-size:19px; text-align:center; }
    .nick-buttons { display:flex; justify-content:center; gap:12px; margin-top:15px; }
  </style>
</head>
<body>
  <div id="game">
    <div class="header"><h1>2137MEME</h1><div class="subtitle">WORTHLESS</div></div>
    <div id="timer">21.37</div>
    <div id="nosaczContainer"><img id="nosacz" src="https://raw.githubusercontent.com/ravb99/2137meme-tapper/main/images/IMG_6353.jpeg"></div>
    <div id="tapCount">Taps: <span id="count">0</span></div>
    <button onclick="changeNickname()">Zmień nick</button>
    <button onclick="showLeaderboard()">TOP 21 LEADERBOARD</button>
    <div id="result" style="display:none;"><span id="finalScore"></span></div>
  </div>

  <div id="leaderboardModal" class="modal">
    <div class="modal-content">
      <div class="title-bar">🏆 TOP 21 TAPPERS</div>
      <div class="window-body"><div id="lbList"></div><button onclick="hideLeaderboard()">Dawaj Janusza!</button></div>
    </div>
  </div>

  <div id="nicknameModal" class="modal">
    <div class="modal-content">
      <div class="title-bar">ZMIANA NICKU</div>
      <div class="window-body">
        <p>Wpisz nowy nick:</p>
        <input type="text" id="nickInput" maxlength="20" placeholder="Janusz420">
        <div class="nick-buttons">
          <button onclick="saveNewNickname()">ZATWIERDZAM</button>
          <button onclick="hideNicknameModal()" style="background:#555;color:#ff0;">ANULUJ</button>
        </div>
      </div>
    </div>
  </div>

  <audio id="kurlaSound" src="https://raw.githubusercontent.com/ravb99/2137meme-tapper/main/sounds/Kurła.m4a"></audio>

  <script>
    console.log("=== 2137MEME TAPPER START ===");

    const supabase = Supabase.createClient(
      'https://gmyhsgxnpbvwgexrvpik.supabase.co',
      'sb_publishable_dPOUiTHcX9Xk7tQQr3oOWw_0aEfDVUm'
    );

    let timeLeft = 21.37, taps = 0, isRunning = false, lastFrame = 0;
    const sound = document.getElementById('kurlaSound');
    const nosacz = document.getElementById('nosacz');

    function getPlayerName() {
      let name = localStorage.getItem('2137playerName');
      if (name) return name;
      const user = Telegram.WebApp.initDataUnsafe?.user;
      name = user?.username ? "@" + user.username : (user?.first_name || "Janusz") + Math.floor(Math.random()*999);
      return name;
    }

    async function saveScore(score) {
      const name = getPlayerName();
      console.log("Zapisuję:", name, score);
      const { error } = await supabase.from('scores').insert([{ name, score }]);
      if (error) console.error("Błąd Supabase:", error);
      else console.log("✅ Zapisano globalnie");
    }

    async function updateLeaderboard() {
      const { data } = await supabase.from('scores').select('name,score').order('score', {ascending:false}).limit(21);
      const list = document.getElementById('lbList');
      list.innerHTML = '';
      (data||[]).forEach((e,i) => {
        const d = document.createElement('div');
        d.className = 'lb-entry';
        d.innerHTML = `<span>${i+1}. ${e.name}</span><span>${e.score}</span>`;
        list.appendChild(d);
      });
    }

    function tap(e) {
      if (!isRunning) startTimer();
      const count = e.touches ? e.touches.length : 1;
      taps += count;
      document.getElementById('count').textContent = taps;

      nosacz.style.filter = 'hue-rotate(30deg) saturate(4) brightness(1.5)';
      setTimeout(() => nosacz.style.filter = '', 120);

      sound.currentTime = 0; sound.play().catch(()=>{});
      for(let i=0; i<count; i++) createKurwa();
    }

    function createKurwa() {
      const k = document.createElement('div');
      k.className = 'kurwa';
      k.textContent = 'Kurła!';
      k.style.left = (Math.random()*200 + 50) + 'px';
      k.style.top = (Math.random()*140 + 60) + 'px';
      document.getElementById('nosaczContainer').appendChild(k);
      setTimeout(() => k.remove(), 1400);
    }

    function startTimer() {
      if (isRunning) return;
      isRunning = true;
      timeLeft = 21.37; taps = 0;
      document.getElementById('count').textContent = 0;
      lastFrame = performance.now();

      function loop(now) {
        if (!isRunning) return;
        const delta = (now - lastFrame)/1000;
        lastFrame = now;
        timeLeft -= delta;
        if (timeLeft <= 0) endRound();
        else {
          document.getElementById('timer').textContent = timeLeft.toFixed(2);
          requestAnimationFrame(loop);
        }
      }
      requestAnimationFrame(loop);
    }

    function endRound() {
      isRunning = false;
      document.getElementById('finalScore').innerHTML = `Koniec! Wynik: <span style="color:#f00">${taps}</span>`;
      saveScore(taps);
      document.getElementById('result').style.display = 'block';
    }

    function showLeaderboard() { updateLeaderboard(); document.getElementById('leaderboardModal').style.display = 'block'; }
    function hideLeaderboard() { document.getElementById('leaderboardModal').style.display = 'none'; }
    function changeNickname() { document.getElementById('nickInput').value = getPlayerName(); document.getElementById('nicknameModal').style.display = 'block'; }
    function saveNewNickname() {
      const n = document.getElementById('nickInput').value.trim();
      if (n) localStorage.setItem('2137playerName', n);
      hideNicknameModal();
    }
    function hideNicknameModal() { document.getElementById('nicknameModal').style.display = 'none'; }

    // === PODŁĄCZENIE KLIKANIA ===
    document.getElementById('nosaczContainer').addEventListener('touchstart', tap, { passive: true });

    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
    console.log("=== GOTOWE - TAPAJ NOSACZA ===");
  </script>
</body>
</html>

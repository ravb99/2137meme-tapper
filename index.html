<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2137MEME TAPPER</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { 
      margin:0; padding:0; 
      background:#0a0a0a; 
      color:#ff0; 
      font-family:'Oswald', system-ui; 
      overflow:hidden; 
      text-align:center; 
      touch-action: none; 
    }
    #game { 
      max-width:420px; 
      margin:0 auto; 
      padding:15px; 
      background:#000; 
      box-shadow:0 0 40px rgba(255,215,0,0.3);
    }

    .header { margin:8px 0 6px; }
    h1 { 
      font-size:46px; 
      font-weight:900; 
      margin:0; 
      letter-spacing:5px;
      line-height:0.9;
    }
    .subtitle { 
      font-size:34px; 
      font-weight:900; 
      color:#fff; 
      margin:0; 
      letter-spacing:8px;
      line-height:0.85;
    }

    #timer { 
      font-size:58px; 
      font-weight:900; 
      color:#f00; 
      margin:15px 0 20px; 
    }

    #nosaczContainer { 
      position:relative; 
      width:300px; 
      height:300px; 
      margin:15px auto; 
      cursor:pointer; 
    }
    #nosacz { width:100%; height:100%; border-radius:50%; border:8px solid #ff0; box-shadow:0 0 30px #ff0; }

    #noseOverlay { 
      position:absolute; top:47%; left:50%; transform:translate(-50%, -50%); 
      width:78px; height:78px; background:#f44; border-radius:50%; 
      box-shadow:0 0 25px #f00; transition:all 0.08s; cursor:pointer;
    }

    .kurwa { 
      position:absolute; color:#ff0; font-size:48px; font-weight:900; 
      pointer-events:none; animation: kurwaAnim 1.2s forwards; 
    }
    @keyframes kurwaAnim {
      0% { transform:translate(-50%, -50%) scale(0.5); opacity:1; }
      100% { transform:translate(-50%, -220px) scale(1.4); opacity:0; }
    }

    #tapCount { font-size:28px; margin:15px 0; }

    button { 
      background: linear-gradient(145deg, #ff0, #ffcc00);
      color:#111; 
      border:3px solid #000;
      padding:18px 32px; 
      font-size:19px; 
      font-weight:900;
      margin:20px auto; 
      border-radius:12px; 
      cursor:pointer; 
      width:85%; 
      box-shadow: 0 8px 25px rgba(255, 215, 0, 0.6);
    }

    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:100; overflow-y:auto; }
    .modal-content { max-width:420px; margin:40px auto; padding:20px; text-align:left; }
    .lb-entry { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #333; font-size:16px; }
  </style>
</head>
<body>
  <div id="game">
    <div class="header">
      <h1>2137MEME</h1>
      <div class="subtitle">WORTHLESS</div>
    </div>
    
    <div id="timer">21.37</div>

    <div id="nosaczContainer" onclick="tap(event)">
      <img id="nosacz" src="https://raw.githubusercontent.com/ravb99/2137meme-tapper/main/images/IMG_6353.jpeg" alt="Nosacz"> 
      <div id="noseOverlay"></div>
    </div>

    <div id="tapCount">Taps: <span id="count">0</span></div>

    <button onclick="showLeaderboard()">TOP 21 LEADERBOARD</button>

    <div id="result" style="display:none; margin-top:20px;">
      <h2>Koniec rundy!</h2>
      <p id="finalScore" style="font-size:26px;"></p>
      <button onclick="restart()">Jeszcze raz → 21.37s</button>
    </div>
  </div>

  <!-- Modal z tabelą -->
  <div id="leaderboardModal" class="modal">
    <div class="modal-content">
      <h2>🏆 TOP 21 TAPPERS</h2>
      <div id="lbList"></div>
      <button onclick="hideLeaderboard()" style="width:auto; margin-top:20px; padding:14px 28px; font-size:18px;">
        Dawaj Janusza!
      </button>
    </div>
  </div>

  <audio id="kurlaSound" src="https://raw.githubusercontent.com/ravb99/2137meme-tapper/main/sounds/Kurła.m4a"></audio>

  <script>
    let timeLeft = 21.37;
    let taps = 0;
    let timer;
    let isRunning = false;
    let leaderboard = JSON.parse(localStorage.getItem('2137leaderboard')) || [];
    const sound = document.getElementById('kurlaSound');

    function playKurwa() {
      sound.currentTime = 0;
      sound.play().catch(() => {});
    }

    function createRandomKurwa() {
      const k = document.createElement('div');
      k.className = 'kurwa';
      k.textContent = 'Kurła!';
      const randomX = Math.random() * 280 + 60;
      const randomY = Math.random() * 160 + 70;
      k.style.left = randomX + 'px';
      k.style.top = randomY + 'px';
      document.getElementById('nosaczContainer').appendChild(k);
      setTimeout(() => k.remove(), 1400);
    }

    function tap(e) {
      if (!isRunning) startTimer();
      taps++;
      document.getElementById('count').textContent = taps;

      const nose = document.getElementById('noseOverlay');
      nose.style.transform = 'translate(-50%, -50%) scale(1.45)';
      nose.style.background = '#f00';
      setTimeout(() => {
        nose.style.transform = 'translate(-50%, -50%) scale(1)';
        nose.style.background = '#f44';
      }, 80);

      playKurwa();
      createRandomKurwa();
    }

    function startTimer() {
      if (isRunning) return;
      isRunning = true;
      timeLeft = 21.37;
      taps = 0;
      document.getElementById('count').textContent = taps;
      document.getElementById('result').style.display = 'none';

      timer = setInterval(() => {
        timeLeft = Math.max(0, timeLeft - 0.01);
        document.getElementById('timer').textContent = timeLeft.toFixed(2);
        if (timeLeft <= 0) endRound();
      }, 10);
    }

    function endRound() {
      clearInterval(timer);
      isRunning = false;
      document.getElementById('finalScore').innerHTML = `Twój wynik: <b>${taps}</b>`;
      saveScore(taps);
      document.getElementById('result').style.display = 'block';
    }

    function saveScore(score) {
      const name = Telegram.WebApp.initDataUnsafe?.user?.username || "Anon" + Math.floor(Math.random()*999);
      leaderboard.push({name, score});
      leaderboard.sort((a,b) => b.score - a.score);
      leaderboard = leaderboard.slice(0, 21);
      localStorage.setItem('2137leaderboard', JSON.stringify(leaderboard));
    }

    function updateLeaderboard() {
      const list = document.getElementById('lbList');
      list.innerHTML = '';
      leaderboard.forEach((entry, i) => {
        const div = document.createElement('div');
        div.className = 'lb-entry';
        div.innerHTML = `<span>${i+1}. ${entry.name}</span><span>${entry.score}</span>`;
        list.appendChild(div);
      });
    }

    function showLeaderboard() {
      updateLeaderboard();
      document.getElementById('leaderboardModal').style.display = 'block';
    }

    function hideLeaderboard() {
      document.getElementById('leaderboardModal').style.display = 'none';
    }

    function restart() {
      document.getElementById('result').style.display = 'none';
      startTimer();
    }

    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TEST TAP</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { margin:0; background:#000; color:#0f0; font-family:sans-serif; text-align:center; height:100vh; display:flex; align-items:center; justify-content:center; touch-action: manipulation; }
    #area { width:300px; height:300px; background:#ff0; border:10px solid #f00; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:40px; font-weight:bold; }
  </style>
</head>
<body>
  <div id="area">TAPAJ MNIE!</div>

  <script>
    console.log("=== TEST TAP URUCHOMIONY ===");

    const area = document.getElementById('area');

    function tap(e) {
      console.log("✅ TAP DETECTED! Liczba palców:", e.touches ? e.touches.length : 1);
      area.style.background = "#0f0";
      setTimeout(() => area.style.background = "#ff0", 150);
      area.textContent = "KURŁA! " + Date.now().toString().slice(-4);
    }

    area.addEventListener('touchstart', tap, { passive: true });
    area.addEventListener('mousedown', tap);   // na testy

    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2137MEME TAPPER</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { 
      margin:0; padding:0; background:#0a0a0a; color:#ff0; 
      font-family:'Oswald', sans-serif; overflow:hidden; height:100vh; 
      touch-action: none; overscroll-behavior: none;
    }
    #game { 
      max-width:420px; margin:0 auto; padding:2px 12px 4px; height:100vh; 
      display:flex; flex-direction:column; align-items:center; 
    }
    h1 { font-size:52px; font-weight:900; margin:4px 0 0 0; letter-spacing:4px; line-height:0.9; }
    .subtitle { font-size:27px; font-weight:900; color:#fff; margin:-6px 0 4px 0; letter-spacing:6px; width:100%; text-align:center; }
    #timer { font-size:58px; font-weight:900; color:#f00; margin:2px 0 6px; }

    #nosaczContainer { 
      position:relative; width:290px; height:290px; margin:2px auto 4px; 
      touch-action: none; 
    }
    #nosacz { 
      width:100%; height:100%; border-radius:50%; border:8px solid #ff0; 
      box-shadow:0 0 30px #ff0; 
      transition: transform 0.09s ease-out, filter 0.14s ease-out;
      will-change: transform, filter;
      image-rendering: crisp-edges;
    }

    .kurwa { 
      position:absolute; color:#ff0; font-weight:900; font-size:26px; 
      text-shadow: 0 0 15px #ff0; pointer-events:none; 
      animation: kurwaPop 760ms forwards; 
      will-change: transform, opacity;
    }
    @keyframes kurwaPop {
      0%   { transform: translateY(0) scale(0.6); opacity:1; }
      100% { transform: translateY(-145px) scale(1.14); opacity:0; }
    }

    #stats { 
      display:flex; justify-content:space-between; align-items:center;
      width:100%; max-width:380px; margin:4px 0 8px; font-size:25px; padding:0 10px; height:42px;
    }

    button, .token-btn { 
      background:#ff0; 
      color:#111; 
      border:4px solid #000; 
      padding:13px 18px; 
      font-size:17.5px; 
      font-weight:900; 
      margin:0; 
      border-radius: 14px; 
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .main-btn { flex:1; }

    .token-btn {
      min-width: 130px;
      height: 68px;
      font-size: 19px;
      font-weight: 900;
      background: linear-gradient(145deg, #ffeb3b, #fbc02d);
      color: #111;
      border: 5px solid #000;
      box-shadow: 
        0 6px 0 #000, 
        0 0 20px #ffeb3b,
        0 0 35px #ffeb3b,
        inset 0 0 25px rgba(255, 235, 59, 0.9);
      text-decoration: none;
      z-index: 15;
      position: relative;
      animation: tokenGlow 2.3s infinite ease-in-out;
    }

    .token-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #000, 
                  0 0 15px #ffeb3b,
                  inset 0 0 20px rgba(255, 235, 59, 0.8);
    }

    @keyframes tokenGlow {
      0%, 100% { 
        box-shadow: 0 6px 0 #000, 0 0 20px #ffeb3b, 0 0 35px #ffeb3b, inset 0 0 20px rgba(255, 235, 59, 0.85);
      }
      50% { 
        box-shadow: 0 6px 0 #000, 0 0 30px #ffeb3b, 0 0 45px #ffeb3b, inset 0 0 35px rgba(255, 235, 59, 0.95);
      }
    }

    .bottom-panel {
      display: flex;
      width: 100%;
      gap: 4px;
      margin: 8px 0 4px;
      align-items: center;
      justify-content: center;
    }

    #restartBtn { 
      position:absolute; 
      top:52%; 
      left:50%; 
      transform:translate(-50%,-50%); 
      background:#0f0; 
      color:#000; 
      font-size:18px; 
      font-weight:900; 
      padding:14px 32px; 
      border:6px solid #000; 
      border-radius:14px; 
      box-shadow:0 0 25px #0f0; 
      z-index:20; 
      display:none; 
      white-space: nowrap;
      min-width: 280px;
    }

    #result { 
      margin:6px 0 4px; 
      font-size:23px; 
      font-weight:900; 
      display:none; 
      text-align:center; 
      width:100%; 
      color:#ff0; 
    }

    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.94); z-index:100; }
    .modal-content { 
      max-width:380px; margin:40px auto; background:#1a1a1a; border:6px solid #ff0; 
      border-radius:4px; overflow:hidden; display:flex; flex-direction:column; 
    }
    .title-bar { 
      background:#333; color:#ff0; padding:12px 15px; font-weight:900; 
      text-align:center; border-bottom:4px solid #ff0; font-size:20px; 
    }
    .window-body { padding:20px; background:#1a1a1a; flex:1; overflow-y:auto; }
    input { 
      width:100%; padding:16px; font-size:22px; background:#111; color:#ff0; 
      border:4px solid #ff0; font-family:'Oswald'; text-align:center; 
      margin-bottom:15px; border-radius:8px;
    }

    #shopItems { padding:15px; overflow-y:auto; max-height:55vh; flex:1; }

    .shop-item { 
      background:#1f1f1f; border:3px solid #ff0; padding:12px; margin:12px 0; 
      border-radius:8px; display:flex; align-items:center; gap:15px;
    }
    .shop-item img { width:110px; height:110px; object-fit:contain; flex-shrink:0; }
    .shop-text { flex:1; }

    .lb-entry { 
      display:flex; justify-content:space-between; padding:12px 15px; margin:6px 0; 
      background:#1f1f1f; border:2px solid #ff0; border-radius:8px; font-size:19px; 
    }
    .lb-entry:nth-child(even) { background:#252525; }
  </style>
</head>
<body>
  <div id="game">
    <h1>2137MEME</h1>
    <div class="subtitle">WORTHLESS</div>
    <div id="timer">21.37</div>
    
    <div id="nosaczContainer">
      <img id="nosacz" src="https://raw.githubusercontent.com/ravb99/2137meme-tapper/main/images/IMG_6353.jpeg" alt="Nosacz"> 
      <button id="restartBtn" onclick="restartGame()">Na Drugą Nóżkę!</button>
    </div>

    <div id="stats">
      <div>Taps: <span id="count">0</span></div>
      <div style="display:flex; align-items:center; gap:6px;">
        <img src="https://raw.githubusercontent.com/ravb99/2137meme-tapper/main/images/coin.png" 
             width="36" style="vertical-align:middle; height:auto;">
        Kurła Coins: <span id="coins">0</span>
      </div>
    </div>

    <div class="bottom-panel">
    <button class="main-btn main-btn-left" onclick="showNicknameModal()">NICK</button>
    
    <a href="https://pump.fun/coin/Df7fM9c3pPjWuurHYGe9a75LCDyh3x1vf3cmNaU1pump" 
       target="_blank" 
       class="token-btn">
      $2137
    </a>
    
    <button class="main-btn main-btn-right" onclick="showShop()">KURŁA SKLEP</button>
  </div>

    <button onclick="showLeaderboard()" style="width:100%; margin-top:4px;">TOP 21 LEADERBOARD</button>

    <div id="result"><span id="finalScore"></span></div>
  </div>

  <!-- Leaderboard Modal -->
  <div id="leaderboardModal" class="modal">
    <div class="modal-content">
      <div class="title-bar">🏆 LEADERBOARD - 2137MEME</div>
      <div class="tab-buttons" style="display:flex; background:#222; padding:4px;">
        <button class="tab-btn active" onclick="switchTab(0)" style="flex:1; margin:4px;">Best Round</button>
        <button class="tab-btn" onclick="switchTab(1)" style="flex:1; margin:4px;">All Time</button>
      </div>
      <div class="window-body">
        <div id="lbList"></div>
      </div>
      <button onclick="hideLeaderboard()" style="margin:12px auto; width:80%;">Dawaj Janusza!</button>
    </div>
  </div>

  <!-- Nick Modal -->
  <div id="nicknameModal" class="modal">
    <div class="modal-content">
      <div class="title-bar">ZMIANA NICKU</div>
      <div class="window-body">
        <p style="margin:10px 0 15px; color:#ccc; text-align:center;">Wpisz nick:</p>
        <input type="text" id="nickInput" maxlength="20" placeholder="Janusz420">
        <div style="display:flex; justify-content:center; gap:12px; margin-top:20px;">
          <button onclick="checkNickAndContinue()" style="width:48%;">Dalej</button>
          <button onclick="hideNicknameModal()" style="width:48%; background:#555; color:#ff0;">Anuluj</button>
        </div>
      </div>
    </div>
  </div>

  <!-- PIN Modal -->
  <div id="pinModal" class="modal">
    <div class="modal-content">
      <div class="title-bar" id="pinModalTitle">PIN</div>
      <div class="window-body">
        <input type="password" id="pinInput" maxlength="4" placeholder="••••" inputmode="numeric">
        <button onclick="verifyOrSetPin()" style="margin-top:15px; width:80%;">Zatwierdź</button>
        <button onclick="hidePinModal()" style="margin-top:8px; background:#555; width:80%;">Anuluj</button>
      </div>
    </div>
  </div>

  <!-- SKLEP MODAL -->
  <div id="shopModal" class="modal">
    <div class="modal-content">
      <div class="title-bar">🛒 SKLEP KURŁA COINS</div>
      <div id="shopItems"></div>
      <button onclick="hideShop()" style="margin:12px auto; width:80%;">Wyjdź</button>
    </div>
  </div>

  <!-- Retro Alert -->
  <div id="retroAlert" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:200; align-items:center; justify-content:center;">
    <div id="alertContent" style="background:#1a1a1a; border:6px solid #ff0; padding:25px; max-width:340px; text-align:center; color:#ff0; font-size:19px; border-radius:4px;"></div>
  </div>

  <audio id="kurlaSound" src="https://raw.githubusercontent.com/ravb99/2137meme-tapper/main/sounds/Kurła.m4a" preload="auto"></audio>

  <script>
    const SUPABASE_URL = 'https://gmyhsgxnpbvwgexrvpik.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_dPOUiTHcX9Xk7tQQr3oOWw_0aEfDVUm';

    let currentPlayer = { 
      name: "", 
      pin: "", 
      kurla_coins: 0, 
      lifetime_taps: 0, 
      spendable_taps: 0, 
      multiplier: 1 
    };

    let currentTab = 0;
    let isNewNick = false;
    let timeLeft = 21.37;
    let taps = 0;
    let isRunning = false;
    let lastFrame = 0;

    const nosaczImg = document.getElementById('nosacz');
    const restartBtn = document.getElementById('restartBtn');
    const resultDiv = document.getElementById('result');
    const sound = document.getElementById('kurlaSound');

    const shopItems = [
      { name: "100 Kurła Coins", cost: 2137, type: "coins", value: 100, img: "" },
      { name: "Golf 3 Szrot", cost: 5000, type: "mult", value: 2, img: "https://raw.githubusercontent.com/ravb99/2137meme-tapper/main/images/golf.png" },
      { name: "Mercedes w124", cost: 15000, type: "mult", value: 3, img: "https://raw.githubusercontent.com/ravb99/2137meme-tapper/main/images/mercedes.png" },
      { name: "Passat B5 1.9 TDI", cost: 45000, type: "mult", value: 4, img: "https://raw.githubusercontent.com/ravb99/2137meme-tapper/main/images/passat.png" }
    ];

    function resetPlayerData() {
      currentPlayer.kurla_coins = 0;
      currentPlayer.lifetime_taps = 0;
      currentPlayer.spendable_taps = 0;
      currentPlayer.multiplier = 1;
      taps = 0;
    }

    function loadPlayer() {
      const saved = localStorage.getItem('2137player');
      if (saved) {
        const parsed = JSON.parse(saved);
        currentPlayer.name = parsed.name || "";
        currentPlayer.pin = parsed.pin || "";
      }
    }

    async function loadPlayerDataFromDB() {
      if (!currentPlayer.name || !currentPlayer.pin) return;
      resetPlayerData();

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/scores?select=kurla_coins,lifetime_taps,spendable_taps,multiplier&name=eq.${encodeURIComponent(currentPlayer.name)}&pin=eq.${currentPlayer.pin}&order=created_at.desc&limit=1`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const data = await res.json();

        if (data.length > 0) {
          currentPlayer.kurla_coins = data[0].kurla_coins || 0;
          currentPlayer.lifetime_taps = data[0].lifetime_taps || 0;
          currentPlayer.spendable_taps = data[0].spendable_taps || 0;
          currentPlayer.multiplier = data[0].multiplier || 1;
        }
        localStorage.setItem('2137player', JSON.stringify(currentPlayer));
      } catch (e) { console.error(e); }
      updateDisplays();
    }

    function updateDisplays() {
      document.getElementById('count').textContent = Math.floor(taps);
      document.getElementById('coins').textContent = currentPlayer.kurla_coins;
    }

    function tap(e) {
      if (restartBtn.style.display === 'block') return;
      if (!isRunning) startTimer();

      const touches = e.touches ? e.touches.length : 1;
      const added = currentPlayer.multiplier * touches;

      taps += added;
      currentPlayer.lifetime_taps += added;
      currentPlayer.spendable_taps += added;

      updateDisplays();

      // Delikatniejszy i płynniejszy efekt
      nosaczImg.style.transform = 'scale(1.10)';
      nosaczImg.style.filter = 'hue-rotate(30deg) saturate(2.8) brightness(1.55)';

      setTimeout(() => {
        nosaczImg.style.transform = 'scale(1)';
        nosaczImg.style.filter = '';
      }, 70);

      sound.currentTime = 0;
      sound.play().catch(() => {});

      createKurwa();
    }

    function createKurwa() {
      const k = document.createElement('div');
      k.className = 'kurwa';
      k.textContent = 'Kurła!';

      const container = document.getElementById('nosaczContainer');
      k.style.left = (Math.random() * 190 + 50) + 'px';
      k.style.top = (Math.random() * 130 + 80) + 'px';

      container.appendChild(k);
      setTimeout(() => k.remove(), 760);
    }

    function startTimer() {
      if (isRunning) return;
      isRunning = true;
      timeLeft = 21.37;
      taps = 0;
      document.getElementById('count').textContent = 0;
      lastFrame = performance.now();

      function loop(now) {
        if (!isRunning) return;
        const delta = (now - lastFrame) / 1000;
        lastFrame = now;
        timeLeft -= delta;
        if (timeLeft <= 0) {
          document.getElementById('timer').textContent = "0.00";
          endRound();
        } else {
          document.getElementById('timer').textContent = timeLeft.toFixed(2);
          requestAnimationFrame(loop);
        }
      }
      requestAnimationFrame(loop);
    }

    function endRound() {
      isRunning = false;
      const finalScore = Math.floor(taps);
      document.getElementById('finalScore').innerHTML = 
        `Koniec rundy! Twój wynik: <span style="color:#f00;">${finalScore}</span> <span style="font-size:20px;">(×${currentPlayer.multiplier})</span>`;
      resultDiv.style.display = 'block';
      saveScore(finalScore);
      restartBtn.style.display = 'block';
    }

    function restartGame() {
      restartBtn.style.display = 'none';
      resultDiv.style.display = 'none';
      timeLeft = 21.37;
      taps = 0;
      isRunning = false;
      document.getElementById('count').textContent = 0;
      document.getElementById('timer').textContent = "21.37";
    }

    async function saveScore(roundScore) {
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/scores`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          },
          body: JSON.stringify([{
            name: currentPlayer.name,
            pin: currentPlayer.pin,
            round_score: roundScore,
            total_score: currentPlayer.lifetime_taps,
            kurla_coins: currentPlayer.kurla_coins,
            lifetime_taps: currentPlayer.lifetime_taps,
            spendable_taps: currentPlayer.spendable_taps,
            multiplier: currentPlayer.multiplier
          }])
        });
        localStorage.setItem('2137player', JSON.stringify(currentPlayer));
      } catch (e) { console.error(e); }
    }

    function showRetroAlert(message) {
      document.getElementById('alertContent').innerHTML = message + '<br><br><button onclick="hideRetroAlert()" style="background:#ff0; color:#000; padding:12px 30px; font-size:18px; border:3px solid #000; border-radius:4px;">OK</button>';
      document.getElementById('retroAlert').style.display = 'flex';
    }

    function hideRetroAlert() {
      document.getElementById('retroAlert').style.display = 'none';
    }

    function showNicknameModal() {
      document.getElementById('nickInput').value = currentPlayer.name || "";
      document.getElementById('nicknameModal').style.display = 'block';
    }
    function hideNicknameModal() { document.getElementById('nicknameModal').style.display = 'none'; }
    function hidePinModal() { document.getElementById('pinModal').style.display = 'none'; }

    async function checkNickAndContinue() {
      const name = document.getElementById('nickInput').value.trim();
      if (!name) return alert("Wpisz nick!");

      currentPlayer.name = name;
      resetPlayerData();
      localStorage.setItem('2137player', JSON.stringify(currentPlayer));

      hideNicknameModal();

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/scores?select=pin&name=eq.${encodeURIComponent(name)}&limit=1`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const data = await res.json();
        isNewNick = !(data.length > 0 && data[0].pin);
        document.getElementById('pinModalTitle').textContent = isNewNick ? "USTAW PIN (4 cyfry)" : "WPISZ PIN";
        document.getElementById('pinInput').value = "";
        document.getElementById('pinModal').style.display = 'block';
      } catch (e) { alert("Błąd połączenia"); }
    }

    async function verifyOrSetPin() {
      const pin = document.getElementById('pinInput').value.trim();
      if (pin.length !== 4) return showRetroAlert("PIN musi mieć dokładnie 4 cyfry!");

      if (isNewNick) {
        currentPlayer.pin = pin;
        localStorage.setItem('2137player', JSON.stringify(currentPlayer));
        hidePinModal();
        showRetroAlert(`Nowy nick zapisany!<br>Nick: <b>${currentPlayer.name}</b><br>PIN: <b>${pin}</b>`);
        await loadPlayerDataFromDB();
      } else {
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/scores?select=pin&name=eq.${encodeURIComponent(currentPlayer.name)}&pin=eq.${pin}&limit=1`, {
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
          });
          const data = await res.json();

          if (data.length > 0) {
            currentPlayer.pin = pin;
            localStorage.setItem('2137player', JSON.stringify(currentPlayer));
            hidePinModal();
            showRetroAlert(`Zalogowano pomyślnie!<br>Nick: <b>${currentPlayer.name}</b>`);
            await loadPlayerDataFromDB();
          } else {
            showRetroAlert("Zły pin prywaciarzu");
            document.getElementById('pinInput').value = "";
          }
        } catch (e) {
          showRetroAlert("Błąd połączenia");
        }
      }
    }

    function showShop() {
      const container = document.getElementById('shopItems');
      container.innerHTML = `<p style="text-align:center; color:#ff0; font-size:22px;">
        Masz: <b>${currentPlayer.kurla_coins}</b> Kurła Coins<br>
        Kurła Punkty: <b>${currentPlayer.spendable_taps}</b><br>
        Multiplier: <b>×${currentPlayer.multiplier}</b>
      </p>`;

      shopItems.forEach((item, i) => {
        const isOwned = item.type === 'mult' && currentPlayer.multiplier >= item.value;
        const div = document.createElement('div');
        div.className = 'shop-item';
        div.innerHTML = `
          <div class="shop-text">
            <strong>${item.name}</strong><br>
            ${item.type === 'coins' ? `+${item.value} Kurła Coins` : `×${item.value} taps`}<br>
            Koszt: ${item.cost} ${item.type === 'coins' ? 'Kurła Punkty' : 'KC'}
          </div>
          ${item.img ? `<img src="${item.img}" alt="${item.name}">` : ''}
          <button onclick="buyItem(${i})" style="min-width:90px; ${isOwned ? 'background:#555; color:#666;' : ''}" ${isOwned ? 'disabled' : ''}>
            ${isOwned ? 'POSIADASZ' : 'KUP'}
          </button>
        `;
        container.appendChild(div);
      });
      document.getElementById('shopModal').style.display = 'block';
    }

    function buyItem(i) {
      const item = shopItems[i];
      if (item.type === 'coins') {
        if (currentPlayer.spendable_taps >= item.cost) {
          currentPlayer.spendable_taps -= item.cost;
          currentPlayer.kurla_coins += item.value;
          saveScore(0);
          showRetroAlert(`✅ Dodano <b>+${item.value}</b> Kurła Coins!`);
        } else {
          showRetroAlert(`Za mało Kurła Punktów!<br>Masz: <b>${currentPlayer.spendable_taps}</b>`);
        }
      } else {
        if (currentPlayer.kurla_coins >= item.cost) {
          currentPlayer.kurla_coins -= item.cost;
          currentPlayer.multiplier = Math.max(currentPlayer.multiplier, item.value);
          saveScore(0);
          showRetroAlert(`Kupiłeś <b>${item.name}</b>!<br>Nowy multiplier: ×${currentPlayer.multiplier}`);
        } else showRetroAlert("Za mało Kurła Coins!");
      }
      updateDisplays();
      showShop();
    }

    function hideShop() {
      document.getElementById('shopModal').style.display = 'none';
    }

    async function updateLeaderboard() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/scores?select=name,pin,round_score,total_score&limit=500`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const data = await response.json();
        const grouped = {};

        data.forEach(row => {
          const key = `${row.name}|${row.pin || ''}`;
          if (!grouped[key]) {
            grouped[key] = { name: row.name, best: Number(row.round_score) || 0, total: Number(row.total_score) || 0 };
          } else {
            grouped[key].best = Math.max(grouped[key].best, Number(row.round_score) || 0);
            grouped[key].total = Math.max(grouped[key].total, Number(row.total_score) || 0);
          }
        });

        const list = document.getElementById('lbList');
        list.innerHTML = '';
        const sorted = Object.values(grouped).sort((a, b) => currentTab === 0 ? (b.best - a.best) : (b.total - a.total));

        sorted.forEach((player, i) => {
          const div = document.createElement('div');
          div.className = 'lb-entry';
          const score = currentTab === 0 ? player.best : player.total;
          div.innerHTML = `<span>${i+1}. ${player.name}</span><span style="color:#0f0; font-weight:900;">${score}</span>`;
          list.appendChild(div);
        });

        if (sorted.length === 0) list.innerHTML = '<div style="color:#f66; padding:30px; text-align:center;">Brak wyników jeszcze...</div>';
      } catch (e) { console.error(e); }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', i===tab));
      updateLeaderboard();
    }

    function showLeaderboard() {
      updateLeaderboard();
      document.getElementById('leaderboardModal').style.display = 'block';
    }

    function hideLeaderboard() {
      document.getElementById('leaderboardModal').style.display = 'none';
    }

    // INICJALIZACJA
    const container = document.getElementById('nosaczContainer');
    container.addEventListener('touchstart', tap, { passive: true });
    container.addEventListener('mousedown', tap);

    loadPlayer();
    updateDisplays();

    if (currentPlayer.name && currentPlayer.pin) {
      loadPlayerDataFromDB();
    }

    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  </script>
</body>
</html>

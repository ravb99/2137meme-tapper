<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2137MEME TAPPER</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { 
      margin:0; padding:0; background:#0a0a0a; color:#ff0; 
      font-family:'Oswald', sans-serif; overflow:hidden; height:100vh; 
      touch-action: none; overscroll-behavior: none;
    }
    #game { 
      max-width:420px; margin:0 auto; padding:2px 12px 4px; height:100vh; 
      display:flex; flex-direction:column; align-items:center; position:relative;
    }
    h1 { font-size:52px; font-weight:900; margin:4px 0 0 0; letter-spacing:4px; line-height:0.9; }
    .subtitle { font-size:27px; font-weight:900; color:#fff; margin:-6px 0 4px 0; letter-spacing:6px; width:100%; text-align:center; }

    #boostInfo {
      font-size: 19px; font-weight: 900; color: #ff0;
      background: rgba(255, 80, 0, 0.35); padding: 4px 16px;
      border-radius: 10px; margin: 4px 0 6px 0; border: 2px solid #ff0;
      display: none; text-align: center; letter-spacing: 1.5px;
    }

    #timer { font-size:58px; font-weight:900; color:#f00; margin:2px 0 6px; }

    #nosaczContainer { 
      position:relative; width:290px; height:290px; margin:2px auto 4px; 
      touch-action: none; cursor: pointer;
    }
    #nosacz { 
      width:100%; height:100%; border-radius:50%; border:8px solid #ff0; 
      box-shadow:0 0 30px #ff0; image-rendering: crisp-edges;
      will-change: transform, filter;
      transition: transform 0.06s ease-out, filter 0.06s ease-out;
      transform: translateZ(0);
    }

    #refBtn {
      position: absolute; top: 92px; right: 12px; width: 54px; height: 54px;
      background: #ffeb3b; color: #111; border: 5px solid #000;
      border-radius: 50%; font-size: 14px; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 0 #000; z-index: 50; cursor: pointer;
    }

    .kurwa { 
      position:absolute; color:#ff0; font-weight:900; font-size:26px; 
      text-shadow: 0 0 15px #ff0; pointer-events:none; 
      animation: kurwaPop 620ms forwards; 
    }
    @keyframes kurwaPop {
      0%   { transform: translateY(0) scale(0.7); opacity:1; }
      100% { transform: translateY(-160px) scale(1.2); opacity:0; }
    }

    #stats { 
      display:flex; justify-content:space-between; align-items:center;
      width:100%; max-width:380px; margin:4px 0 8px; font-size:25px; padding:0 10px; height:42px;
    }

    button, .token-btn { 
      background:#ffeb3b; color:#111; border: none; padding:13px 18px; 
      font-size:17.5px; font-weight:900; margin:0; border-radius: 14px; 
      height: 58px; display: flex; align-items: center; justify-content: center;
    }
    .main-btn { flex:1; min-width: 0; }

    .token-btn {
      min-width: 138px; height: 58px; font-size: 19.5px; font-weight: 900;
      background: #ffeb3b; color: #111; box-shadow: 0 5px 0 #000;
      animation: tokenPulse 2.6s infinite ease-in-out;
    }
    @keyframes tokenPulse { 0%,100% {background:#ffeb3b; transform:scale(1);} 50% {background:#ffed4e; transform:scale(1.05);} }

    .bottom-panel { 
      display: flex; width: 100%; gap: 4px; margin: 8px 0 4px; 
      align-items: center; justify-content: center;
    }

    #memeResultScreen {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.98);
      z-index: 160;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    #memeResultScreen.show {
      opacity: 1;
    }

    .crt-frame {
      width: 92%;
      max-width: 390px;
      height: 92vh;
      max-height: 680px;
      background: #0c0c0c;
      border: 22px solid #1a1a1a;
      border-top: 42px solid #1a1a1a;
      border-radius: 8px;
      box-shadow: 0 0 60px rgba(0,255,80,0.5), inset 0 0 100px rgba(0,0,0,0.95);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .result-header {
      background: #1f1f1f;
      padding: 16px 0;
      text-align: center;
      border-bottom: 6px solid #ff0;
      font-size: 24px;
      font-weight: 900;
      color: #ff0;
      letter-spacing: 2px;
      flex-shrink: 0;
    }

    .meme-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: #000;
    }

    #randomMeme {
      width: 100%;
      display: block;
      image-rendering: pixelated;
    }

    .meme-footer {
      background: #1a1a1a;
      padding: 18px;
      text-align: center;
      border-top: 6px solid #ff0;
      flex-shrink: 0;
    }

    .meme-footer button {
      background: #0f0;
      color: #000;
      font-size: 21px;
      font-weight: 900;
      padding: 18px 40px;
      border: 7px solid #000;
      border-radius: 12px;
      width: 100%;
      box-shadow: 0 8px 0 #000;
    }

    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.94); z-index:100; }
    .modal-content { 
      max-width:380px; margin:40px auto; background:#1a1a1a; border:6px solid #ff0; 
      border-radius:4px; overflow:hidden; display:flex; flex-direction:column; height:85vh;
    }
    .title-bar { 
      background:#333; color:#ff0; padding:12px 15px; font-weight:900; 
      text-align:center; border-bottom:4px solid #ff0; font-size:20px; 
    }
    .window-body { 
      padding:15px; background:#1a1a1a; flex:1; overflow-y:auto; 
    }

    .lb-entry { 
      display:flex; justify-content:space-between; padding:14px 16px; margin:8px 0; 
      background:#1f1f1f; border:2px solid #ff0; border-radius:8px; font-size:19px; 
    }
    .lb-entry:nth-child(even) { background:#252525; }

    input { 
      width:100%; padding:16px; font-size:22px; background:#111; color:#ff0; 
      border:4px solid #ff0; font-family:'Oswald'; text-align:center; 
      margin-bottom:15px; border-radius:8px;
    }

    #shopItems { 
      padding:15px; 
      overflow-y:auto; 
      flex:1; 
    }

    .shop-item { 
      background:#1f1f1f; border:3px solid #ff0; padding:12px; margin:12px 0; 
      border-radius:8px; display:flex; align-items:center; gap:15px;
    }
    .shop-item img { width:110px; height:110px; object-fit:contain; flex-shrink:0; }
    .shop-text { flex:1; }
  </style>
</head>
<body>
  <div id="game">
    <h1>2137MEME</h1>
    <div class="subtitle">WORTHLESS</div>
    <div id="boostInfo">🍖 KIEŁBASA NA GRILLU</div>
    <div id="timer">21.37</div>
    
    <div id="nosaczContainer">
      <img id="nosacz" src="https://raw.githubusercontent.com/ravb99/2137meme-tapper/main/images/IMG_6353.jpeg" alt="Nosacz"> 
    </div>

    <div id="refBtn" onclick="copyRefLink()">REF</div>

    <div id="stats">
      <div>Taps: <span id="count">0</span></div>
      <div style="display:flex; align-items:center; gap:6px;">
        <img src="https://raw.githubusercontent.com/ravb99/2137meme-tapper/main/images/coin.png" width="36" style="vertical-align:middle; height:auto;">
        Kurła Coins: <span id="coins">0</span>
      </div>
    </div>

    <div class="bottom-panel">
      <button class="main-btn" id="nickButton" onclick="showNicknameModal()">NICK</button>
      <a href="https://pump.fun/coin/Df7fM9c3pPjWuurHYGe9a75LCDyh3x1vf3cmNaU1pump" target="_blank" class="token-btn">$2137</a>
      <button class="main-btn" onclick="showShop()">KURŁA SKLEP</button>
    </div>

    <button onclick="showLeaderboard()" style="width:100%; margin-top:4px;">TOP 21 LEADERBOARD</button>
  </div>

  <div id="memeResultScreen">
    <div class="crt-frame">
      <div class="result-header">KONIEC RUNDY! TWÓJ WYNIK: <span id="memeFinalScore" style="color:#f00;"></span></div>
      <div class="meme-scroll">
        <img id="randomMeme" src="" alt="Meme">
      </div>
      <div class="meme-footer">
        <button onclick="closeMemeScreen()">Na Drugą Nóżkę! 🥃</button>
      </div>
    </div>
  </div>

  <div id="dailyModal" class="modal">
    <div class="modal-content" style="height:auto; max-height:420px;">
      <div class="title-bar">DAILY REWARD</div>
      <div class="window-body" style="text-align:center; padding:30px 20px;">
        <h2 id="dailyStreakText" style="font-size:32px; margin:10px 0;">Dzień 1</h2>
        <p id="dailyRewardText" style="font-size:28px; color:#0f0; margin:20px 0;">+100 Kurła Coins</p>
        <button onclick="claimDaily()" style="width:85%; padding:18px; font-size:20px; background:#0f0; color:#000; border:6px solid #000; border-radius:12px;">ODBIEŻ NAGRODĘ</button>
      </div>
    </div>
  </div>

  <div id="referralModal" class="modal">
    <div class="modal-content" style="height:auto; max-height:420px;">
      <div class="title-bar">REFERRAL REWARD</div>
      <div class="window-body" style="text-align:center; padding:30px 20px;">
        <h2 id="refModalTitle" style="font-size:32px; margin:10px 0; color:#0f0;">REFERRAL BONUS</h2>
        <p id="refModalText" style="font-size:28px; color:#ff0; margin:20px 0;"></p>
        <button onclick="hideReferralModal()" style="width:85%; padding:18px; font-size:20px; background:#0f0; color:#000; border:6px solid #000; border-radius:12px;">ODBIEŻ NAGRODĘ</button>
      </div>
    </div>
  </div>

  <div id="leaderboardModal" class="modal">
    <div class="modal-content">
      <div class="title-bar">🏆 LEADERBOARD - 2137MEME</div>
      <div class="tab-buttons" style="display:flex; background:#222; padding:4px;">
        <button class="tab-btn active" onclick="switchTab(0)" style="flex:1; margin:4px;">Best Round</button>
        <button class="tab-btn" onclick="switchTab(1)" style="flex:1; margin:4px;">All Time</button>
      </div>
      <div class="window-body">
        <div id="lbList"></div>
      </div>
      <button onclick="hideLeaderboard()" style="margin:12px auto 20px; width:85%; height:58px; font-size:19px; background:#0f0; color:#000; border:5px solid #000;">
        Dawaj Janusza!
      </button>
    </div>
  </div>

  <div id="nicknameModal" class="modal">
    <div class="modal-content">
      <div class="title-bar">ZMIANA NICKU</div>
      <div class="window-body">
        <p style="margin:10px 0 15px; color:#ccc; text-align:center;">Wpisz nick:</p>
        <input type="text" id="nickInput" maxlength="20" placeholder="Janusz420">
        <div style="display:flex; justify-content:center; gap:12px; margin-top:20px;">
          <button onclick="checkNickAndContinue()" style="width:48%;">Dalej</button>
          <button onclick="hideNicknameModal()" style="width:48%; background:#555; color:#ff0;">Anuluj</button>
        </div>
      </div>
    </div>
  </div>

  <div id="pinModal" class="modal">
    <div class="modal-content">
      <div class="title-bar" id="pinModalTitle">PIN</div>
      <div class="window-body">
        <input type="password" id="pinInput" maxlength="4" placeholder="••••" inputmode="numeric">
        <button onclick="verifyOrSetPin()" style="margin-top:15px; width:80%;">Zatwierdź</button>
        <button onclick="hidePinModal()" style="margin-top:8px; background:#555; width:80%;">Anuluj</button>
      </div>
    </div>
  </div>

  <div id="shopModal" class="modal">
    <div class="modal-content">
      <div class="title-bar">🛒 SKLEP KURŁA COINS</div>
      <div id="shopItems"></div>
      <button onclick="hideShop()" style="margin:15px auto 20px; width:85%; height:58px; font-size:19px; background:#ff0; color:#000; border:5px solid #000;">
        Wyjdź
      </button>
    </div>
  </div>

  <div id="retroAlert" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:200; align-items:center; justify-content:center;">
    <div id="alertContent" style="background:#1a1a1a; border:6px solid #ff0; padding:25px; max-width:340px; text-align:center; color:#ff0; font-size:19px; border-radius:4px;"></div>
  </div>

  <audio id="kurlaSound" src="https://raw.githubusercontent.com/ravb99/2137meme-tapper/main/sounds/Kurła.m4a" preload="auto"></audio>

  <script>
    const SUPABASE_URL = 'https://gmyhsgxnpbvwgexrvpik.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_dPOUiTHcX9Xk7tQQr3oOWw_0aEfDVUm';

    let currentPlayer = { 
      name: "", 
      pin: "", 
      kurla_coins: 0, 
      lifetime_taps: 0, 
      spendable_taps: 0, 
      multiplier: 1,
      kielbasaCount: 0,
      current_streak: 0,
      last_login: null,
      referred_by: null,
      referral_claimed: false,
      first_login: null
    };

    let currentTab = 0;
    let isNewNick = false;
    let timeLeft = 21.37;
    let taps = 0;
    let isRunning = false;
    let lastFrame = 0;
    let memesList = [];
    let referrerFromUrl = null;
    let isLoggedIn = false;

    const nosaczImg = document.getElementById('nosacz');
    const boostInfo = document.getElementById('boostInfo');
    const sound = document.getElementById('kurlaSound');
    const nickButton = document.getElementById('nickButton');

    const shopItems = [
      { name: "100 Kurła Coins", cost: 2137, type: "coins", value: 100, img: "" },
      { name: "Kiełbasa Grillowa ×2", cost: 200, type: "temp_mult", value: 2, img: "https://raw.githubusercontent.com/ravb99/2137meme-tapper/main/images/kiełbasa.png" },
      { name: "Golf 3 Szrot", cost: 5000, type: "mult", value: 2, img: "https://raw.githubusercontent.com/ravb99/2137meme-tapper/main/images/golf.png" },
      { name: "Mercedes w124", cost: 15000, type: "mult", value: 3, img: "https://raw.githubusercontent.com/ravb99/2137meme-tapper/main/images/mercedes.png" },
      { name: "Passat B5 1.9 TDI", cost: 45000, type: "mult", value: 4, img: "https://raw.githubusercontent.com/ravb99/2137meme-tapper/main/images/passat.png" }
    ];

    function resetPlayerData() {
      currentPlayer.kurla_coins = 0;
      currentPlayer.lifetime_taps = 0;
      currentPlayer.spendable_taps = 0;
      currentPlayer.multiplier = 1;
      currentPlayer.kielbasaCount = 0;
      taps = 0;
    }

    function updateBoostDisplay() {
      if (currentPlayer.kielbasaCount > 0) {
        boostInfo.textContent = `🍖 KIEŁBASA NA GRILLU (${currentPlayer.kielbasaCount})`;
        boostInfo.style.display = 'block';
      } else {
        boostInfo.style.display = 'none';
      }
    }

    function updateNickButton() {
      nickButton.textContent = currentPlayer.name ? currentPlayer.name : "NICK";
    }

    function loadPlayer() {
      const saved = localStorage.getItem('2137player');
      if (saved) {
        const parsed = JSON.parse(saved);
        currentPlayer.name = parsed.name || "";
        currentPlayer.pin = parsed.pin || "";
        currentPlayer.first_login = parsed.first_login || null;
      }

      const urlParams = new URLSearchParams(window.location.search);
      referrerFromUrl = urlParams.get('ref');
    }

    async function loadPlayerDataFromDB() {
      if (!currentPlayer.name || !currentPlayer.pin) return;
      resetPlayerData();

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/scores?select=kurla_coins,lifetime_taps,spendable_taps,multiplier,current_streak,last_login,referred_by,referral_claimed,first_login&name=eq.${encodeURIComponent(currentPlayer.name)}&pin=eq.${currentPlayer.pin}&order=created_at.desc&limit=1`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const data = await res.json();

        if (data.length > 0) {
          const p = data[0];
          currentPlayer.kurla_coins = p.kurla_coins || 0;
          currentPlayer.lifetime_taps = p.lifetime_taps || 0;
          currentPlayer.spendable_taps = p.spendable_taps || 0;
          currentPlayer.multiplier = p.multiplier || 1;
          currentPlayer.current_streak = p.current_streak || 0;
          currentPlayer.last_login = p.last_login;
          currentPlayer.referred_by = p.referred_by;
          currentPlayer.referral_claimed = p.referral_claimed || false;
          currentPlayer.first_login = p.first_login;
        }
        localStorage.setItem('2137player', JSON.stringify(currentPlayer));
      } catch (e) { console.error(e); }

      updateDisplays();
      updateBoostDisplay();
      updateNickButton();
      checkDailyReward();
      checkReferralBonus();
    }

    function updateDisplays() {
      document.getElementById('count').textContent = Math.floor(taps);
      document.getElementById('coins').textContent = currentPlayer.kurla_coins;
    }

    function tap(e) {
      if (!isLoggedIn) {
        showNicknameModal();
        return;
      }
      if (!isRunning) startTimer();

      const touches = e.touches ? e.touches.length : 1;
      const tempMult = currentPlayer.kielbasaCount > 0 ? 2 : 1;
      const totalMult = currentPlayer.multiplier * tempMult;
      const added = touches * totalMult;

      taps += added;
      currentPlayer.lifetime_taps += added;
      currentPlayer.spendable_taps += added;

      updateDisplays();

      nosaczImg.style.transition = 'none';
      nosaczImg.style.transform = 'scale(1.10) translateZ(0)';
      nosaczImg.style.filter = 'hue-rotate(35deg) saturate(2.8) brightness(1.55)';

      requestAnimationFrame(() => {
        nosaczImg.style.transition = 'transform 0.06s ease-out, filter 0.06s ease-out';
        nosaczImg.style.transform = 'scale(1) translateZ(0)';
        nosaczImg.style.filter = '';
      });

      sound.currentTime = 0;
      sound.play().catch(() => {});
      createKurwa();
    }

    function createKurwa() {
      const k = document.createElement('div');
      k.className = 'kurwa';
      k.textContent = 'Kurła!';
      k.style.left = (Math.random() * 190 + 50) + 'px';
      k.style.top = (Math.random() * 130 + 80) + 'px';
      document.getElementById('nosaczContainer').appendChild(k);
      setTimeout(() => k.remove(), 620);
    }

    function startTimer() {
      if (isRunning) return;
      isRunning = true;
      timeLeft = 21.37;
      taps = 0;
      document.getElementById('count').textContent = 0;
      lastFrame = performance.now();

      function loop(now) {
        if (!isRunning) return;
        const delta = (now - lastFrame) / 1000;
        lastFrame = now;
        timeLeft -= delta;
        if (timeLeft <= 0) {
          document.getElementById('timer').textContent = "0.00";
          endRound();
        } else {
          document.getElementById('timer').textContent = timeLeft.toFixed(2);
          requestAnimationFrame(loop);
        }
      }
      requestAnimationFrame(loop);
    }

    async function loadMemeList() {
      try {
        const res = await fetch('https://raw.githubusercontent.com/ravb99/2137meme-tapper/main/images/memes/memes.json');
        const data = await res.json();
        memesList = data.memes || [];
      } catch (e) { console.error(e); }
    }

    function getRandomMemeUrl() {
      if (memesList.length === 0) return "https://raw.githubusercontent.com/ravb99/2137meme-tapper/main/images/IMG_6356.jpeg";
      const randomFile = memesList[Math.floor(Math.random() * memesList.length)];
      return `https://raw.githubusercontent.com/ravb99/2137meme-tapper/main/images/memes/${randomFile}`;
    }

    function showMemeResultScreen(finalScore, totalMult) {
      document.getElementById('memeFinalScore').innerHTML = `${finalScore} <span style="font-size:19px;">(×${totalMult})</span>`;
      document.getElementById('randomMeme').src = getRandomMemeUrl();
      const screen = document.getElementById('memeResultScreen');
      screen.style.display = 'flex';
      setTimeout(() => screen.classList.add('show'), 10);
    }

    function closeMemeScreen() {
      const screen = document.getElementById('memeResultScreen');
      screen.classList.remove('show');
      setTimeout(() => {
        screen.style.display = 'none';
        restartGame();
      }, 400);
    }

    function endRound() {
      isRunning = false;
      const finalScore = Math.floor(taps);
      const tempMult = currentPlayer.kielbasaCount > 0 ? 2 : 1;
      const totalMult = currentPlayer.multiplier * tempMult;

      if (currentPlayer.kielbasaCount > 0) {
        currentPlayer.kielbasaCount--;
      }
      updateBoostDisplay();
      saveScore(finalScore);

      showMemeResultScreen(finalScore, totalMult);
    }

    function restartGame() {
      timeLeft = 21.37;
      taps = 0;
      isRunning = false;
      document.getElementById('count').textContent = 0;
      document.getElementById('timer').textContent = "21.37";
    }

    async function saveScore(roundScore) {
      if (!currentPlayer.name || !currentPlayer.pin) return;

      const payload = [{
        name: currentPlayer.name,
        pin: currentPlayer.pin,
        round_score: Math.floor(roundScore),
        total_score: Math.floor(currentPlayer.lifetime_taps),
        kurla_coins: Math.floor(currentPlayer.kurla_coins),
        lifetime_taps: Math.floor(currentPlayer.lifetime_taps),
        spendable_taps: Math.floor(currentPlayer.spendable_taps),
        multiplier: currentPlayer.multiplier,
        current_streak: currentPlayer.current_streak || 0,
        last_login: currentPlayer.last_login || new Date().toISOString(),
        referred_by: currentPlayer.referred_by,
        referral_claimed: currentPlayer.referral_claimed || false,
        first_login: currentPlayer.first_login || new Date().toISOString()
      }];

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/scores`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Prefer': 'resolution=merge-duplicates'
          },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          console.log("✅ Zapisano pomyślnie");
        } else {
          console.error("Błąd zapisu:", await response.text());
        }
      } catch (e) {
        console.error("Błąd sieci:", e);
      }

      localStorage.setItem('2137player', JSON.stringify(currentPlayer));
    }

    function showNicknameModal() {
      document.getElementById('nickInput').value = currentPlayer.name || "";
      document.getElementById('nicknameModal').style.display = 'block';
    }

    function hideNicknameModal() { document.getElementById('nicknameModal').style.display = 'none'; }
    function hidePinModal() { document.getElementById('pinModal').style.display = 'none'; }
    function hideReferralModal() { document.getElementById('referralModal').style.display = 'none'; }

    async function checkNickAndContinue() {
      const name = document.getElementById('nickInput').value.trim();
      if (!name) return alert("Wpisz nick!");

      currentPlayer.name = name;
      resetPlayerData();
      localStorage.setItem('2137player', JSON.stringify(currentPlayer));

      hideNicknameModal();

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/scores?select=pin&name=eq.${encodeURIComponent(name)}&limit=1`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const data = await res.json();
        isNewNick = !(data.length > 0 && data[0].pin);
        document.getElementById('pinModalTitle').textContent = isNewNick ? "USTAW PIN (4 cyfry)" : "WPISZ PIN";
        document.getElementById('pinInput').value = "";
        document.getElementById('pinModal').style.display = 'block';
      } catch (e) { alert("Błąd połączenia"); }
    }

    async function verifyOrSetPin() {
      const pin = document.getElementById('pinInput').value.trim();
      if (pin.length !== 4) return alert("PIN musi mieć dokładnie 4 cyfry!");

      if (isNewNick) {
        currentPlayer.pin = pin;
        currentPlayer.first_login = new Date().toISOString();
        localStorage.setItem('2137player', JSON.stringify(currentPlayer));
        hidePinModal();
        isLoggedIn = true;
        updateNickButton();
        await loadPlayerDataFromDB();
        
        if (referrerFromUrl) {
          setTimeout(() => checkReferralBonus(), 600);
        }
      } else {
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/scores?select=pin&name=eq.${encodeURIComponent(currentPlayer.name)}&pin=eq.${pin}&limit=1`, {
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
          });
          const data = await res.json();

          if (data.length > 0) {
            currentPlayer.pin = pin;
            localStorage.setItem('2137player', JSON.stringify(currentPlayer));
            hidePinModal();
            isLoggedIn = true;
            updateNickButton();
            await loadPlayerDataFromDB();
          } else {
            alert("Zły pin prywaciarzu");
            document.getElementById('pinInput').value = "";
          }
        } catch (e) {
          alert("Błąd połączenia");
        }
      }
    }

    async function checkReferralBonus() {
      if (!referrerFromUrl || currentPlayer.referral_claimed || !currentPlayer.name) return;

      currentPlayer.referred_by = referrerFromUrl;
      currentPlayer.kurla_coins += 200;
      currentPlayer.kielbasaCount += 1;
      currentPlayer.referral_claimed = true;

      updateBoostDisplay();
      updateDisplays();

      document.getElementById('refModalTitle').textContent = "Dzięki zaproszeniu!";
      document.getElementById('refModalText').innerHTML = `+<b>200</b> Kurła Coins + 1 Kiełbasa`;
      document.getElementById('referralModal').style.display = 'block';

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/scores?select=pin,kurla_coins&name=eq.${encodeURIComponent(referrerFromUrl)}&limit=1`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const data = await res.json();

        let inviterPin = "0000";
        let currentCoins = 0;

        if (data.length > 0) {
          inviterPin = data[0].pin || "0000";
          currentCoins = data[0].kurla_coins || 0;
        }

        await fetch(`${SUPABASE_URL}/rest/v1/scores`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Prefer': 'resolution=merge-duplicates'
          },
          body: JSON.stringify([{
            name: referrerFromUrl,
            pin: inviterPin,
            kurla_coins: currentCoins + 300,
            round_score: 0,
            total_score: 0,
            lifetime_taps: 0,
            spendable_taps: 0,
            multiplier: 1,
            current_streak: 0,
            last_login: new Date().toISOString(),
            referred_by: null,
            referral_claimed: false,
            first_login: new Date().toISOString()
          }])
        });
      } catch (e) {
        console.error("Błąd bonusu dla invitera", e);
      }

      saveScore(0);
    }

    function checkDailyReward() {
      if (!currentPlayer.last_login || !currentPlayer.first_login) return;

      const last = new Date(currentPlayer.last_login);
      const now = new Date();
      const hoursDiff = (now - last) / (1000 * 60 * 60);

      if (hoursDiff < 24) return;

      let newStreak = currentPlayer.current_streak;
      if (hoursDiff > 48) newStreak = 1;
      else newStreak++;

      showDailyModal(newStreak);
    }

    function showDailyModal(streak) {
      const rewards = [0, 100, 150, 200, 300];
      const reward = streak >= 5 ? 300 : rewards[streak];

      document.getElementById('dailyStreakText').textContent = `SERIA ${streak} DNI`;
      document.getElementById('dailyRewardText').innerHTML = `+<b>${reward}</b> Kurła Coins`;

      document.getElementById('dailyModal').style.display = 'block';
    }

    async function claimDaily() {
      const streak = currentPlayer.current_streak || 1;
      const rewards = [0, 100, 150, 200, 300];
      const reward = streak >= 5 ? 300 : rewards[streak];

      currentPlayer.kurla_coins += reward;
      currentPlayer.current_streak = streak >= 5 ? streak + 1 : streak;
      currentPlayer.last_login = new Date().toISOString();

      document.getElementById('dailyModal').style.display = 'none';
      updateDisplays();
      saveScore(0);
    }

    function showShop() {
      const container = document.getElementById('shopItems');
      container.innerHTML = `<p style="text-align:center; color:#ff0; font-size:22px;">
        Masz: <b>${currentPlayer.kurla_coins}</b> Kurła Coins<br>
        Kurła Punkty: <b>${currentPlayer.spendable_taps}</b><br>
        Multiplier: <b>×${currentPlayer.multiplier}</b>
      </p>`;

      shopItems.forEach((item, i) => {
        const div = document.createElement('div');
        div.className = 'shop-item';
        
        let description = '';
        if (item.type === 'coins') description = `+${item.value} Kurła Coins (za punkty)`;
        else if (item.type === 'temp_mult') description = `×${item.value} na 1 rundę`;
        else description = `Stały ×${item.value}`;

        const isCar = item.type === "mult";
        const isOwned = isCar && currentPlayer.multiplier >= item.value;

        div.innerHTML = `
          <div class="shop-text">
            <strong>${item.name}</strong><br>
            ${description}<br>
            Koszt: ${item.cost} ${item.type === 'coins' ? 'Kurła Punktów' : 'KC'}
          </div>
          ${item.img ? `<img src="${item.img}" alt="${item.name}">` : ''}
          <button onclick="buyItem(${i})" style="min-width:90px;" ${isOwned ? 'disabled' : ''}>${isOwned ? 'KUPIONE' : 'KUP'}</button>
        `;
        container.appendChild(div);
      });
      document.getElementById('shopModal').style.display = 'block';
    }

    function buyItem(i) {
      const item = shopItems[i];

      if (item.type === "coins") {
        if (currentPlayer.spendable_taps < item.cost) return;
        currentPlayer.spendable_taps -= item.cost;
        currentPlayer.kurla_coins += item.value;
      } else {
        if (currentPlayer.kurla_coins < item.cost) return;
        currentPlayer.kurla_coins -= item.cost;

        if (item.type === "temp_mult") {
          currentPlayer.kielbasaCount += 1;
          updateBoostDisplay();
        } else {
          currentPlayer.multiplier = Math.max(currentPlayer.multiplier, item.value);
        }
      }

      saveScore(0);
      updateDisplays();
      showShop();
    }

    function hideShop() {
      document.getElementById('shopModal').style.display = 'none';
    }

    async function updateLeaderboard() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/scores?select=name,pin,round_score,total_score&limit=2000`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const data = await response.json();
        const grouped = {};

        data.forEach(row => {
          const key = `${row.name}|${row.pin || ''}`;
          if (!grouped[key]) {
            grouped[key] = { name: row.name, best: Number(row.round_score) || 0, total: Number(row.total_score) || 0 };
          } else {
            grouped[key].best = Math.max(grouped[key].best, Number(row.round_score) || 0);
            grouped[key].total = Math.max(grouped[key].total, Number(row.total_score) || 0);
          }
        });

        const list = document.getElementById('lbList');
        list.innerHTML = '';
        const sorted = Object.values(grouped).sort((a, b) => currentTab === 0 ? (b.best - a.best) : (b.total - a.total));

        sorted.forEach((player, i) => {
          const div = document.createElement('div');
          div.className = 'lb-entry';
          const score = currentTab === 0 ? player.best : player.total;
          div.innerHTML = `<span>${i+1}. ${player.name}</span><span style="color:#0f0; font-weight:900;">${score}</span>`;
          list.appendChild(div);
        });

        if (sorted.length === 0) {
          list.innerHTML = '<div style="color:#f66; padding:30px; text-align:center;">Brak wyników jeszcze...</div>';
        }
      } catch (e) { console.error(e); }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', i===tab));
      updateLeaderboard();
    }

    function showLeaderboard() {
      updateLeaderboard();
      document.getElementById('leaderboardModal').style.display = 'block';
    }

    function hideLeaderboard() {
      document.getElementById('leaderboardModal').style.display = 'none';
    }

    function copyRefLink() {
      if (!currentPlayer.name) return;
      const link = `https://ravb99.github.io/2137meme-tapper/?ref=${encodeURIComponent(currentPlayer.name)}`;
      navigator.clipboard.writeText(link);
    }

    const container = document.getElementById('nosaczContainer');
    container.addEventListener('pointerdown', tap, { passive: false });

    loadPlayer();
    updateDisplays();
    updateBoostDisplay();
    updateNickButton();
    loadMemeList();

    if (currentPlayer.name && currentPlayer.pin) {
      isLoggedIn = true;
      loadPlayerDataFromDB();
    }

    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2137MEME TAPPER</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body { 
      margin:0; padding:0; background:#0a0a0a; color:#ff0; 
      font-family:'Oswald', sans-serif; overflow:hidden; height:100vh; 
      touch-action: none; overscroll-behavior: none;
    }
    #game { 
      max-width:420px; margin:0 auto; padding:2px 12px 4px; height:100vh; 
      display:flex; flex-direction:column; align-items:center; 
    }
    h1 { font-size:52px; font-weight:900; margin:4px 0 0 0; letter-spacing:4px; line-height:0.9; }
    .subtitle { font-size:27px; font-weight:900; color:#fff; margin:-6px 0 4px 0; letter-spacing:6px; width:100%; text-align:center; }
    #timer { font-size:58px; font-weight:900; color:#f00; margin:2px 0 6px; }

    #nosaczContainer { position:relative; width:290px; height:290px; margin:2px auto 4px; }
    #nosacz { width:100%; height:100%; border-radius:50%; border:8px solid #ff0; box-shadow:0 0 30px #ff0; transition: filter 0.04s ease-out; }

    #stats { 
      display:flex; justify-content:space-between; align-items:center;
      width:100%; max-width:380px; margin:4px 0 8px; font-size:25px; padding:0 10px; height:42px;
    }

    button { 
      background:#ff0; color:#111; border:4px solid #000; 
      padding:13px 18px; font-size:17.5px; font-weight:900; 
      margin:4px 3px; border-radius:8px; 
    }
    .main-btn { flex:1; max-width:48%; }

    #restartBtn { 
      position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); 
      background:#0f0; color:#000; font-size:21px; font-weight:900; 
      padding:16px 32px; border:6px solid #000; border-radius:12px; 
      box-shadow:0 0 25px #0f0; z-index:20; display:none; 
    }
    #result { margin:6px 0 4px; font-size:23px; font-weight:900; display:none; text-align:center; width:100%; color:#ff0; }

    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.94); z-index:100; }
    .modal-content { max-width:380px; margin:35px auto; background:#2a2a2a; border:6px solid #777; border-radius:3px; overflow:hidden; display:flex; flex-direction:column; height:82vh; }
    .title-bar { background:#333; color:#ddd; padding:9px 12px; font-weight:900; text-align:left; border-bottom:4px solid #555; font-size:19px; }
    .tab-buttons { display:flex; background:#222; }
    .tab-btn { flex:1; padding:12px; background:#222; color:#ff0; border:none; font-weight:900; font-size:17px; }
    .tab-btn.active { background:#ff0; color:#111; }
    .window-body { padding:15px; background:#2a2a2a; flex:1; display:flex; flex-direction:column; overflow:hidden; }
    #lbList { flex:1; overflow-y:auto; padding-right:10px; }
    .lb-entry { display:flex; justify-content:space-between; padding:10px 12px; margin:6px 0; background:#1f1f1f; border:2px solid #666; color:#ff0; font-size:17px; }
    .shop-item { background:#1f1f1f; border:3px solid #ff0; padding:14px; margin:12px 0; border-radius:8px; text-align:center; }
    input { width:100%; padding:14px; font-size:19px; background:#1a1a1a; color:#ff0; border:3px solid #777; font-family:'Oswald'; text-align:center; margin-bottom:15px; }
  </style>
</head>
<body>
  <div id="game">
    <h1>2137MEME</h1>
    <div class="subtitle">WORTHLESS</div>
    <div id="timer">21.37</div>
    
    <div id="nosaczContainer">
      <img id="nosacz" src="https://raw.githubusercontent.com/ravb99/2137meme-tapper/main/images/IMG_6353.jpeg" alt="Nosacz"> 
      <button id="restartBtn" onclick="restartGame()">Na Drugą Nóżkę!</button>
    </div>

    <div id="stats">
      <div>Taps: <span id="count">0</span></div>
      <div style="display:flex; align-items:center; gap:6px;">
        <img src="https://raw.githubusercontent.com/ravb99/2137meme-tapper/main/images/coin.png" 
             width="36" style="vertical-align:middle; height:auto;">
        Kurła Coins: <span id="coins">0</span>
      </div>
    </div>

    <div style="display:flex; width:100%; gap:6px; margin:4px 0 8px;">
      <button class="main-btn" onclick="showNicknameModal()">NICK</button>
      <button class="main-btn" onclick="showShop()">KURŁA SKLEP</button>
    </div>

    <button onclick="showLeaderboard()" style="width:100%;">TOP 21 LEADERBOARD</button>

    <div id="result"><span id="finalScore"></span></div>
  </div>

  <!-- Leaderboard Modal -->
  <div id="leaderboardModal" class="modal">
    <div class="modal-content">
      <div class="title-bar">🏆 LEADERBOARD - 2137MEME</div>
      <div class="tab-buttons">
        <button class="tab-btn active" onclick="switchTab(0)">Best Round</button>
        <button class="tab-btn" onclick="switchTab(1)">All Time</button>
      </div>
      <div class="window-body">
        <div id="lbList"></div>
      </div>
      <button onclick="hideLeaderboard()" style="margin:12px auto; width:80%;">Dawaj Janusza!</button>
    </div>
  </div>

  <!-- Nick Modal -->
  <div id="nicknameModal" class="modal">
    <div class="modal-content">
      <div class="title-bar">ZMIANA NICKU</div>
      <div class="window-body">
        <p style="margin:10px 0 15px; color:#ccc;">Wpisz nick:</p>
        <input type="text" id="nickInput" maxlength="20" placeholder="Janusz420">
        <div style="display:flex; justify-content:center; gap:12px; margin-top:15px; width:100%;">
          <button onclick="checkNickAndContinue()" style="width:48%;">Dalej</button>
          <button onclick="hideNicknameModal()" style="width:48%; background:#555; color:#ff0;">Anuluj</button>
        </div>
      </div>
    </div>
  </div>

  <!-- PIN Modal -->
  <div id="pinModal" class="modal">
    <div class="modal-content">
      <div class="title-bar" id="pinModalTitle">PIN</div>
      <div class="window-body">
        <input type="password" id="pinInput" maxlength="4" placeholder="••••" inputmode="numeric">
        <button onclick="verifyOrSetPin()" style="margin-top:15px; width:80%;">Zatwierdź</button>
        <button onclick="hidePinModal()" style="margin-top:8px; background:#555; width:80%;">Anuluj</button>
      </div>
    </div>
  </div>

  <!-- SKLEP MODAL -->
  <div id="shopModal" class="modal">
    <div class="modal-content">
      <div class="title-bar">🛒 SKLEP KURŁA COINS</div>
      <div id="shopItems" style="padding:15px; overflow-y:auto; flex:1;"></div>
      <button onclick="hideShop()" style="margin:12px auto; width:80%;">Wyjdź</button>
    </div>
  </div>

  <audio id="kurlaSound" src="https://raw.githubusercontent.com/ravb99/2137meme-tapper/main/sounds/Kurła.m4a" preload="auto"></audio>

  <script>
    const SUPABASE_URL = 'https://gmyhsgxnpbvwgexrvpik.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_dPOUiTHcX9Xk7tQQr3oOWw_0aEfDVUm';

    let currentPlayer = { name: "", pin: "", kurla_coins: 0, total_taps: 0, multiplier: 1 };
    let currentTab = 0;
    let isNewNick = false;

    let timeLeft = 21.37;
    let taps = 0;
    let isRunning = false;
    let lastFrame = 0;

    const nosaczImg = document.getElementById('nosacz');
    const restartBtn = document.getElementById('restartBtn');
    const resultDiv = document.getElementById('result');
    const sound = document.getElementById('kurlaSound');

    const shopItems = [
      { name: "100 Kurła Coins", cost: 2137, type: "coins", value: 100 },
      { name: "Golf 3 Szrot", cost: 5000, type: "mult", value: 2 },
      { name: "Mercedes w124", cost: 15000, type: "mult", value: 3 },
      { name: "Passat B5 1.9 TDI", cost: 45000, type: "mult", value: 4 }
    ];

    function loadPlayer() {
      const saved = localStorage.getItem('2137player');
      if (saved) currentPlayer = JSON.parse(saved);
      currentPlayer.kurla_coins = currentPlayer.kurla_coins || 0;
      currentPlayer.total_taps = currentPlayer.total_taps || 0;
      currentPlayer.multiplier = currentPlayer.multiplier || 1;
    }

    async function loadPlayerDataFromDB() {
      if (!currentPlayer.name || !currentPlayer.pin) return;
      
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/scores?select=kurla_coins,total_taps,multiplier&name=eq.${encodeURIComponent(currentPlayer.name)}&pin=eq.${currentPlayer.pin}&order=total_taps.desc&limit=1`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const data = await res.json();

        if (data.length > 0) {
          currentPlayer.kurla_coins = data[0].kurla_coins || 0;
          currentPlayer.total_taps = data[0].total_taps || 0;
          currentPlayer.multiplier = data[0].multiplier || 1;
        } else {
          currentPlayer.kurla_coins = 0;
          currentPlayer.total_taps = 0;
          currentPlayer.multiplier = 1;
        }
        localStorage.setItem('2137player', JSON.stringify(currentPlayer));
      } catch (e) { 
        console.error("Błąd pobierania z bazy", e); 
      }
      updateDisplays();
    }

    function updateDisplays() {
      document.getElementById('count').textContent = taps;
      document.getElementById('coins').textContent = currentPlayer.kurla_coins;
    }

    function tap(e) {
      if (restartBtn.style.display === 'block') return;
      if (!isRunning) startTimer();

      taps += 1;
      currentPlayer.total_taps += 1;
      updateDisplays();

      nosaczImg.style.filter = `hue-rotate(35deg) saturate(4.5) brightness(1.7)`;
      setTimeout(() => nosaczImg.style.filter = '', 38);

      sound.currentTime = 0;
      sound.play().catch(() => {});
      createRandomKurwa();
    }

    function createRandomKurwa() {
      const k = document.createElement('div');
      k.textContent = 'Kurła!';
      k.style.position = 'absolute';
      k.style.left = (Math.random() * 260 + 60) + 'px';
      k.style.top = (Math.random() * 160 + 70) + 'px';
      k.style.color = '#ff0';
      k.style.fontWeight = '900';
      k.style.fontSize = '22px';
      k.style.pointerEvents = 'none';
      document.getElementById('nosaczContainer').appendChild(k);
      setTimeout(() => k.remove(), 1100);
    }

    function startTimer() {
      if (isRunning) return;
      isRunning = true;
      timeLeft = 21.37;
      taps = 0;
      document.getElementById('count').textContent = taps;
      lastFrame = performance.now();

      function loop(now) {
        if (!isRunning) return;
        const delta = (now - lastFrame) / 1000;
        lastFrame = now;
        timeLeft -= delta;
        if (timeLeft <= 0) {
          document.getElementById('timer').textContent = "0.00";
          endRound();
        } else {
          document.getElementById('timer').textContent = timeLeft.toFixed(2);
          requestAnimationFrame(loop);
        }
      }
      requestAnimationFrame(loop);
    }

    function endRound() {
      isRunning = false;
      document.getElementById('finalScore').innerHTML = `Koniec rundy! Twój wynik: <span style="color:#f00;">${taps}</span>`;
      resultDiv.style.display = 'block';
      saveScore(taps);
      restartBtn.style.display = 'block';
    }

    function restartGame() {
      restartBtn.style.display = 'none';
      resultDiv.style.display = 'none';
      timeLeft = 21.37;
      taps = 0;
      isRunning = false;
      document.getElementById('count').textContent = 0;
      document.getElementById('timer').textContent = "21.37";
    }

    async function saveScore(roundScore) {
      try {
        await fetch(`${SUPABASE_URL}/rest/v1/scores`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`
          },
          body: JSON.stringify([{
            name: currentPlayer.name,
            pin: currentPlayer.pin,
            round_score: roundScore,
            total_score: currentPlayer.total_taps,
            kurla_coins: currentPlayer.kurla_coins,
            total_taps: currentPlayer.total_taps,
            multiplier: currentPlayer.multiplier
          }])
        });
        localStorage.setItem('2137player', JSON.stringify(currentPlayer));
      } catch (e) { console.error(e); }
    }

    function showNicknameModal() {
      document.getElementById('nickInput').value = currentPlayer.name || "";
      document.getElementById('nicknameModal').style.display = 'block';
    }
    function hideNicknameModal() { document.getElementById('nicknameModal').style.display = 'none'; }
    function hidePinModal() { document.getElementById('pinModal').style.display = 'none'; }

    async function checkNickAndContinue() {
      const name = document.getElementById('nickInput').value.trim();
      if (!name) return alert("Wpisz nick!");
      currentPlayer.name = name;
      hideNicknameModal();

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/scores?select=pin&name=eq.${encodeURIComponent(name)}&limit=1`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const data = await res.json();
        isNewNick = !(data.length > 0 && data[0].pin);
        document.getElementById('pinModalTitle').textContent = isNewNick ? "USTAW PIN (4 cyfry)" : "WPISZ PIN";
        document.getElementById('pinInput').value = "";
        document.getElementById('pinModal').style.display = 'block';
      } catch (e) { alert("Błąd połączenia"); }
    }

    async function verifyOrSetPin() {
      const pin = document.getElementById('pinInput').value.trim();
      if (pin.length !== 4) return alert("PIN musi mieć dokładnie 4 cyfry!");

      if (isNewNick) {
        currentPlayer.pin = pin;
        localStorage.setItem('2137player', JSON.stringify(currentPlayer));
        hidePinModal();
        alert(`Nowy nick zapisany!\nNick: ${currentPlayer.name}\nPIN: ${pin}`);
      } else {
        try {
          const res = await fetch(`${SUPABASE_URL}/rest/v1/scores?select=pin&name=eq.${encodeURIComponent(currentPlayer.name)}&pin=eq.${pin}&limit=1`, {
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
          });
          const data = await res.json();
          if (data.length > 0) {
            currentPlayer.pin = pin;
            localStorage.setItem('2137player', JSON.stringify(currentPlayer));
            hidePinModal();
            alert(`Zalogowano pomyślnie!\nNick: ${currentPlayer.name}`);
            await loadPlayerDataFromDB();
          } else alert("Błędny PIN!");
        } catch (e) { alert("Błąd walidacji"); }
      }
    }

    function showShop() {
      const container = document.getElementById('shopItems');
      container.innerHTML = `<p style="text-align:center; color:#ff0; font-size:22px;">
        Masz: <b>${currentPlayer.kurla_coins}</b> Kurła Coins<br>
        <small>Total taps: ${currentPlayer.total_taps}</small>
      </p>`;

      shopItems.forEach((item, i) => {
        const isOwned = item.type === 'mult' && currentPlayer.multiplier >= item.value;
        const div = document.createElement('div');
        div.className = 'shop-item';
        div.innerHTML = `
          <strong>${item.name}</strong><br>
          ${item.type === 'coins' ? `+${item.value} Kurła Coins` : `×${item.value} taps`}<br>
          Koszt: ${item.cost} ${item.type === 'coins' ? 'taps' : 'KC'}
          <button onclick="buyItem(${i})" style="margin-top:10px; width:100%; ${isOwned ? 'background:#555; color:#666;' : ''}" ${isOwned ? 'disabled' : ''}>
            ${isOwned ? 'POSIADASZ' : 'KUP'}
          </button>
        `;
        container.appendChild(div);
      });
      document.getElementById('shopModal').style.display = 'block';
    }

    function buyItem(i) {
      const item = shopItems[i];
      if (item.type === 'coins') {
        if (currentPlayer.total_taps >= item.cost) {
          currentPlayer.total_taps -= item.cost;
          currentPlayer.kurla_coins += item.value;
          saveScore(0);
          alert(`✅ +${item.value} Kurła Coins dodane!`);
        } else {
          alert(`Za mało total taps!\nMasz: ${currentPlayer.total_taps} / Potrzebujesz: ${item.cost}`);
        }
      } else {
        if (currentPlayer.kurla_coins >= item.cost) {
          currentPlayer.kurla_coins -= item.cost;
          currentPlayer.multiplier = Math.max(currentPlayer.multiplier, item.value);
          saveScore(0);
          alert(`Kupiłeś ${item.name}!\nNowy multiplier: ×${currentPlayer.multiplier}`);
        } else alert("Za mało Kurła Coins!");
      }
      updateDisplays();
      showShop();
    }

    function hideShop() {
      document.getElementById('shopModal').style.display = 'none';
    }

    async function updateLeaderboard() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/scores?select=name,pin,round_score,total_score&limit=500`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const data = await response.json();
        const grouped = {};

        data.forEach(row => {
          const key = `${row.name}|${row.pin || ''}`;
          if (!grouped[key]) {
            grouped[key] = { name: row.name, best: Number(row.round_score) || 0, total: Number(row.total_score) || 0 };
          } else {
            grouped[key].best = Math.max(grouped[key].best, Number(row.round_score) || 0);
            grouped[key].total = Math.max(grouped[key].total, Number(row.total_score) || 0);
          }
        });

        const list = document.getElementById('lbList');
        list.innerHTML = '';
        const sorted = Object.values(grouped).sort((a, b) => currentTab === 0 ? (b.best - a.best) : (b.total - a.total));

        sorted.forEach((player, i) => {
          const div = document.createElement('div');
          div.className = 'lb-entry';
          const score = currentTab === 0 ? player.best : player.total;
          div.innerHTML = `<span>${i+1}. ${player.name}</span><span style="color:#0f0; font-weight:900;">${score}</span>`;
          list.appendChild(div);
        });

        if (sorted.length === 0) list.innerHTML = '<div style="color:#f66; padding:30px; text-align:center;">Brak wyników jeszcze...</div>';
      } catch (e) { console.error(e); }
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', i===tab));
      updateLeaderboard();
    }

    function showLeaderboard() {
      updateLeaderboard();
      document.getElementById('leaderboardModal').style.display = 'block';
    }

    function hideLeaderboard() {
      document.getElementById('leaderboardModal').style.display = 'none';
    }

    // INICJALIZACJA - wzmocniona wersja
    const container = document.getElementById('nosaczContainer');
    container.addEventListener('touchstart', tap, { passive: true });
    container.addEventListener('mousedown', tap);

    loadPlayer();
    updateDisplays();

    // Najsilniejsze ładowanie po odświeżeniu
    if (currentPlayer.name && currentPlayer.pin) {
      loadPlayerDataFromDB();
    }

    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  </script>
</body>
</html>

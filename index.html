<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TEST DAILY STRIKE</title>
  <style>
    body {
      background: #0a0a0a;
      color: #ff0;
      font-family: 'Oswald', sans-serif;
      text-align: center;
      padding: 40px 20px;
    }
    h1 { font-size: 48px; margin: 20px 0; }
    button {
      background: #ff0;
      color: #000;
      border: none;
      padding: 18px 40px;
      font-size: 22px;
      font-weight: 900;
      margin: 20px;
      border-radius: 12px;
      cursor: pointer;
    }
    #testBtn {
      background: #f00;
      color: white;
      padding: 14px 28px;
      font-size: 18px;
      margin-top: 40px;
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .modal-content {
      background: #1a1a1a;
      border: 8px solid #ff0;
      padding: 40px 30px;
      max-width: 340px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <h1>TEST DAILY STRIKE</h1>
  <p>Kliknij przycisk poniżej i wpisz numer dnia</p>
  
  <button id="testBtn">TEST STRIKE</button>

  <!-- Daily Modal -->
  <div id="dailyModal" class="modal">
    <div class="modal-content">
      <h2 id="dailyStreakText" style="color:#0f0; margin:10px 0 20px;">SERIA 1 DNI</h2>
      <p id="dailyRewardText" style="font-size:32px; color:#ff0; margin:20px 0;">+100 Kurła Coins</p>
      <button onclick="claimTestDaily()" style="width:100%; padding:16px; font-size:20px;">ODBIEŻ NAGRODĘ</button>
    </div>
  </div>

  <script>
    function testDailyStreak() {
      const day = prompt("Wpisz numer dnia streak (1-10):", "3");
      if (!day) return;

      const num = parseInt(day);
      const rewards = [0, 100, 150, 200, 300];
      const reward = num >= 5 ? 300 : (rewards[num] || 300);

      document.getElementById('dailyStreakText').textContent = `SERIA ${num} DNI`;
      document.getElementById('dailyRewardText').innerHTML = `+<b>${reward}</b> Kurła Coins`;
      document.getElementById('dailyModal').style.display = 'flex';
    }

    function claimTestDaily() {
      const text = document.getElementById('dailyRewardText').innerHTML;
      alert("Odebrano: " + text + "\n\n(Streak zapisany symulacyjnie)");
      document.getElementById('dailyModal').style.display = 'none';
    }

    // Kliknięcie przycisku
    document.getElementById('testBtn').addEventListener('click', testDailyStreak);
  </script>
</body>
</html>

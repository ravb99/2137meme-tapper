<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Supabase Test</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #111; color: #0f0; text-align: center; }
    button { padding: 15px 30px; font-size: 18px; background: #ff0; color: #000; border: none; margin: 20px; }
    #log { margin-top: 30px; text-align: left; background: #000; padding: 15px; white-space: pre-wrap; font-family: monospace; }
  </style>
</head>
<body>
  <h2>Test zapisu do Supabase</h2>
  <button onclick="testSave()">TEST ZAPISU</button>
  <div id="log"></div>

  <script>
    const SUPABASE_URL = 'https://gmyhsgxnpbvwgexrvpik.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_dPOUiTHcX9Xk7tQQr3oOWw_0aEfDVUm';

    async function testSave() {
      const log = document.getElementById('log');
      log.innerHTML = 'Wysyłam...\n';

      const payload = [{
        name: "TestUser" + Date.now(),
        pin: "1234",
        round_score: 777,
        total_score: 1337,
        kurla_coins: 999,
        lifetime_taps: 1337,
        spendable_taps: 500,
        multiplier: 1
      }];

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/scores`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Prefer': 'resolution=merge-duplicates'
          },
          body: JSON.stringify(payload)
        });

        const text = await res.text();
        log.innerHTML += `Status: ${res.status}\nOdpowiedź:\n${text}`;
        
        if (res.ok) {
          log.innerHTML += `\n\n✅ ZAPISANO POMYŚLNIE!`;
        } else {
          log.innerHTML += `\n\n❌ BŁĄD`;
        }
      } catch (err) {
        log.innerHTML += `\nBŁĄD: ${err.message}`;
      }
    }
  </script>
</body>
</html>

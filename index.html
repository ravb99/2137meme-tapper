<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2137MEME TAPPER</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { margin:0; padding:0; background:#0a0a0a; color:#ff0; font-family:'Press Start 2P', system-ui; overflow:hidden; text-align:center; }
    #game { max-width:420px; margin:0 auto; padding:20px; }
    h1 { font-size:28px; margin:10px 0 5px; text-shadow:0 0 15px #ff0; }
    #timer { font-size:52px; font-weight:bold; color:#f00; text-shadow:0 0 20px #f00; margin:15px 0; }
    
    #nosaczContainer { position:relative; width:300px; height:300px; margin:20px auto; cursor:pointer; }
    #nosacz { width:100%; height:100%; border-radius:50%; border:8px solid #ff0; box-shadow:0 0 30px #ff0; }
    
    #noseOverlay { 
      position:absolute; 
      top:48%; 
      left:50%; 
      transform:translate(-50%, -50%); 
      width:110px; 
      height:110px; 
      background:#f44; 
      border-radius:50%; 
      box-shadow:0 0 25px #f00; 
      transition:all 0.12s; 
      cursor:pointer;
    }

    .kurwa { 
      position:absolute; 
      color:#ff0; 
      font-size:42px; 
      font-weight:900; 
      text-shadow:0 0 15px #f00; 
      pointer-events:none; 
      animation: kurwaAnim 1.1s forwards; 
    }
    @keyframes kurwaAnim {
      0% { transform:translate(-50%, -50%) scale(0.6); opacity:1; }
      100% { transform:translate(-50%, -180px) scale(1.3); opacity:0; }
    }

    #tapCount { font-size:32px; margin:10px 0; }
  </style>
</head>
<body>
  <div id="game">
    <h1>$2137MEME TAPPER</h1>
    <div id="timer">21.37</div>

    <div id="nosaczContainer" onclick="tap(event)">
      <img id="nosacz" src="https://i.imgur.com/MUOkn.jpg" alt="Nosacz"> 
      <div id="noseOverlay"></div>
    </div>

    <div id="tapCount">Taps: <span id="count">0</span></div>
  </div>

  <script>
    let timeLeft = 21.37;
    let taps = 0;
    let timer;
    let isRunning = false;

    function createKurwa(x, y) {
      const k = document.createElement('div');
      k.className = 'kurwa';
      k.textContent = 'Kurła!';
      k.style.left = x + 'px';
      k.style.top = y + 'px';
      document.getElementById('nosaczContainer').appendChild(k);
      setTimeout(() => k.remove(), 1300);
    }

    function tap(e) {
      if (!isRunning) startTimer();

      taps++;
      document.getElementById('count').textContent = taps;

      const nose = document.getElementById('noseOverlay');
      nose.style.transform = 'translate(-50%, -50%) scale(1.4)';
      nose.style.background = '#f00';

      setTimeout(() => {
        nose.style.transform = 'translate(-50%, -50%) scale(1)';
        nose.style.background = '#f44';
      }, 140);

      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const clickY = e.clientY - rect.top;
      createKurwa(clickX, clickY - 50);
    }

    function startTimer() {
      if (isRunning) return;
      isRunning = true;
      timeLeft = 21.37;
      taps = 0;
      document.getElementById('count').textContent = taps;
      timer = setInterval(() => {
        timeLeft = Math.max(0, timeLeft - 0.01);
        document.getElementById('timer').textContent = timeLeft.toFixed(2);
        if (timeLeft <= 0) endRound();
      }, 10);
    }

    function endRound() {
      clearInterval(timer);
      isRunning = false;
      alert(`Koniec! Twój wynik: ${taps} taps`);
    }

    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  </script>
</body>
</html>

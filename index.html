<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2137MEME TAPPER</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { 
      margin:0; padding:0; 
      background:#0a0a0a; 
      color:#ff0; 
      font-family:'Oswald', system-ui; 
      overflow:hidden; 
      text-align:center; 
      touch-action: manipulation; 
      height:100vh;
    }
    #game { 
      max-width:420px; 
      margin:0 auto; 
      padding:4px 15px 8px; 
      height:100vh; 
      display:flex; 
      flex-direction:column;
    }

    .header { margin:2px 0 3px; }
    h1 { font-size:42px; font-weight:900; margin:0; letter-spacing:4px; line-height:0.95; }
    .subtitle { font-size:29px; font-weight:900; color:#fff; margin:0; letter-spacing:7px; line-height:0.9; }

    #timer { 
      font-size:62px; 
      font-weight:900; 
      color:#f00; 
      margin:6px 0 8px; 
    }

    #nosaczContainer { 
      position:relative; 
      width:298px; 
      height:298px; 
      margin:4px auto 6px; 
      cursor:pointer; 
    }
    #nosacz { 
      width:100%; 
      height:100%; 
      border-radius:50%; 
      border:8px solid #ff0; 
      box-shadow:0 0 30px #ff0; 
      transition: filter 0.09s ease-out;
    }

    #noseOverlay { 
      position:absolute; 
      top:47%; 
      left:50%; 
      transform:translate(-50%, -50%); 
      width:172px; 
      height:172px; 
      background: transparent;
      opacity: 0;
      border-radius:50%; 
      pointer-events: all;
    }

    .kurwa { 
      position:absolute; color:#ff0; font-size:46px; font-weight:900; 
      pointer-events:none; animation: kurwaAnim 1.1s forwards; 
    }
    @keyframes kurwaAnim {
      0% { transform:translate(-50%, -50%) scale(0.6); opacity:1; }
      100% { transform:translate(-50%, -190px) scale(1.3); opacity:0; }
    }

    #tapCount { font-size:27px; margin:6px 0 8px; }

    button { 
      background: #ff0;
      color:#111; 
      border:4px solid #000;
      padding:12px 20px;        /* <<< ZMNIEJSZONA WYSOKOŚĆ */
      font-size:17px; 
      font-weight:900;
      margin:5px auto; 
      border-radius:8px; 
      cursor:pointer; 
      width:88%; 
    }

    #result { 
      margin:8px 0 6px; 
      font-size:24px; 
      font-weight:900; 
    }

    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:100; }
    .modal-content { max-width:420px; margin:40px auto; padding:20px; text-align:left; }
    .lb-entry { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid #333; font-size:16px; }
  </style>
</head>
<body>
  <div id="game">
    <div class="header">
      <h1>2137MEME</h1>
      <div class="subtitle">WORTHLESS</div>
    </div>
    
    <div id="timer">21.37</div>

    <div id="nosaczContainer">
      <img id="nosacz" src="https://raw.githubusercontent.com/ravb99/2137meme-tapper/main/images/IMG_6353.jpeg" alt="Nosacz"> 
      <div id="noseOverlay"></div>
    </div>

    <div id="tapCount">Taps: <span id="count">0</span></div>
    
    <button onclick="changeNickname()">Zmień nick</button>
    <button onclick="showLeaderboard()">TOP 21 LEADERBOARD</button>

    <div id="result" style="display:none;">
      <span id="finalScore"></span>
    </div>
  </div>

  <!-- reszta modalu i audio bez zmian -->
  <div id="leaderboardModal" class="modal">
    <div class="modal-content">
      <h2>🏆 TOP 21 TAPPERS</h2>
      <div id="lbList"></div>
      <button onclick="hideLeaderboard()">Dawaj Janusza!</button>
    </div>
  </div>

  <audio id="kurlaSound" src="https://raw.githubusercontent.com/ravb99/2137meme-tapper/main/sounds/Kurła.m4a" preload="auto"></audio>

  <script>
    // (Cały skrypt bez zmian - ten sam co miałeś wcześniej)
    let timeLeft = 21.37;
    let taps = 0;
    let isRunning = false;
    let lastFrame = 0;
    let leaderboard = JSON.parse(localStorage.getItem('2137leaderboard')) || [];
    const sound = document.getElementById('kurlaSound');
    const nosaczImg = document.getElementById('nosacz');

    function getPlayerName() {
      const saved = localStorage.getItem('2137playerName');
      if (saved) return saved;
      const user = Telegram.WebApp.initDataUnsafe?.user;
      if (user?.username) return "@" + user.username;
      if (user?.first_name) return user.first_name + (user.last_name ? " " + user.last_name : "");
      return "Janusz" + Math.floor(Math.random()*999);
    }

    function playKurwa() {
      sound.currentTime = 0;
      sound.play().catch(() => {});
    }

    function createRandomKurwa() {
      const k = document.createElement('div');
      k.className = 'kurwa';
      k.textContent = 'Kurła!';
      const randomX = Math.random() * 280 + 60;
      const randomY = Math.random() * 160 + 70;
      k.style.left = randomX + 'px';
      k.style.top = randomY + 'px';
      document.getElementById('nosaczContainer').appendChild(k);
      setTimeout(() => k.remove(), 1300);
    }

    function tap(e) {
      if (!isRunning) startTimer();
      const touchCount = e.touches ? e.touches.length : 1;
      taps += touchCount;
      document.getElementById('count').textContent = taps;

      nosaczImg.style.filter = `hue-rotate(20deg) saturate(3.4) brightness(1.38)`;
      setTimeout(() => nosaczImg.style.filter = '', 95);

      playKurwa();
      for (let i = 0; i < touchCount; i++) createRandomKurwa();
    }

    function startTimer() {
      if (isRunning) return;
      isRunning = true;
      timeLeft = 21.37;
      taps = 0;
      document.getElementById('count').textContent = taps;
      lastFrame = performance.now();

      function loop(now) {
        if (!isRunning) return;
        const delta = (now - lastFrame) / 1000;
        lastFrame = now;
        timeLeft -= delta;
        if (timeLeft <= 0) endRound();
        else {
          document.getElementById('timer').textContent = timeLeft.toFixed(2);
          requestAnimationFrame(loop);
        }
      }
      requestAnimationFrame(loop);
    }

    function endRound() {
      isRunning = false;
      document.getElementById('finalScore').innerHTML = `Koniec rundy! Twój wynik: <span style="color:#f00;">${taps}</span>`;
      saveScore(taps);
      document.getElementById('result').style.display = 'block';
    }

    function saveScore(score) {
      const name = getPlayerName();
      leaderboard.push({name, score});
      leaderboard.sort((a,b) => b.score - a.score);
      leaderboard = leaderboard.slice(0, 21);
      localStorage.setItem('2137leaderboard', JSON.stringify(leaderboard));
    }

    function updateLeaderboard() {
      const list = document.getElementById('lbList');
      list.innerHTML = '';
      leaderboard.forEach((entry, i) => {
        const div = document.createElement('div');
        div.className = 'lb-entry';
        div.innerHTML = `<span>${i+1}. ${entry.name}</span><span>${entry.score}</span>`;
        list.appendChild(div);
      });
    }

    function showLeaderboard() { updateLeaderboard(); document.getElementById('leaderboardModal').style.display = 'block'; }
    function hideLeaderboard() { document.getElementById('leaderboardModal').style.display = 'none'; }

    function changeNickname() {
      const current = getPlayerName();
      const newName = prompt("Wpisz swój nick:", current);
      if (newName && newName.trim() !== "") {
        localStorage.setItem('2137playerName', newName.trim());
        alert("Nick zmieniony na: " + newName.trim());
      }
    }

    const container = document.getElementById('nosaczContainer');
    container.addEventListener('touchstart', tap, { passive: true });
    container.addEventListener('mousedown', tap);

    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  </script>
</body>
</html>
